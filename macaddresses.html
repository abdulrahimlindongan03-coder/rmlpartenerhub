<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WiFi Device & MAC Manager</title>
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #0b0d14;
            --bg-card: rgba(20, 25, 38, 0.85);
            --bg-card-hover: rgba(28, 35, 52, 0.95);
            --bg-modal: #131824;
            --bg-input: #0a0d14;
            --accent-gold: #c5a059;
            --accent-gold-light: #e5c178;
            --accent-gold-glow: rgba(197, 160, 89, 0.25);
            --border-subtle: rgba(197, 160, 89, 0.2);
            --border-highlight: rgba(197, 160, 89, 0.4);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --status-paid-bg: rgba(16, 185, 129, 0.15);
            --status-paid-text: #34d399;
            --status-paid-border: rgba(16, 185, 129, 0.3);
            --status-due-bg: rgba(239, 68, 68, 0.15);
            --status-due-text: #f87171;
            --status-due-border: rgba(239, 68, 68, 0.3);
            --status-warning-bg: rgba(245, 158, 11, 0.15);
            --status-warning-text: #fbbf24;
            --status-warning-border: rgba(245, 158, 11, 0.3);
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(197, 160, 89, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(30, 58, 138, 0.12) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
            overflow-x: hidden;
        }

        /* Mobile Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(11, 13, 20, 0.6);
            border-left: 1px solid rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Header */
        header {
            background: rgba(11, 13, 20, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 1.25rem;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-gold), #8a6d3b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.1rem;
            box-shadow: 0 0 12px var(--accent-gold-glow);
        }

        .brand h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-main);
            font-weight: 700;
            line-height: 1.1;
        }

        .brand h1 span {
            color: var(--accent-gold);
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .menu-toggle-btn {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid var(--border-subtle);
            color: var(--accent-gold-light);
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .menu-toggle-btn:active {
            transform: scale(0.92);
            background: rgba(197, 160, 89, 0.25);
        }

        /* Drawer Navigation */
        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 12, 0.75);
            backdrop-filter: blur(6px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .drawer-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .nav-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-modal);
            border-left: 1px solid var(--border-highlight);
            z-index: 1001;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            transform: translateX(100%);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .drawer-backdrop.active .nav-drawer {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .drawer-header h3 {
            font-size: 1rem;
            color: var(--accent-gold);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }

        .drawer-menu {
            list-style: none;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .drawer-menu-item {
            padding: 0.9rem 1rem;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .drawer-menu-item i {
            color: var(--accent-gold);
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .drawer-menu-item:hover, .drawer-menu-item:active {
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--accent-gold);
            transform: translateX(-4px);
        }

        .drawer-footer {
            padding: 1.25rem;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.2);
            font-weight: 500;
        }

        /* Buttons */
        .btn {
            padding: 0.6rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold), #967433);
            color: #0b0d14;
            border: none;
            box-shadow: 0 4px 15px var(--accent-gold-glow);
        }

        .btn-primary:active {
            background: linear-gradient(135deg, var(--accent-gold-light), var(--accent-gold));
        }

        .btn-sm {
            padding: 0.4rem 0.75rem;
            font-size: 0.75rem;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Content Area */
        .content {
            padding: 1.25rem;
            flex: 1;
        }

        .dashboard-toolbar {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Dashboard List */
        .owners-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .owner-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .owner-card:active {
            background: var(--bg-card-hover);
            border-color: var(--border-highlight);
            transform: scale(0.99);
        }

        .owner-main-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.25), rgba(255, 255, 255, 0.05));
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold-light);
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .owner-details-text h3 {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .due-indicator {
            font-size: 0.75rem;
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 500;
        }

        .due-indicator.due-warning {
            color: var(--status-warning-text);
        }

        .due-indicator.due-alert {
            color: var(--status-due-text);
        }

        .due-indicator.due-ok {
            color: var(--text-muted);
        }

        /* Badges */
        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.725rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-paid {
            background: var(--status-paid-bg);
            color: var(--status-paid-text);
            border: 1px solid var(--status-paid-border);
        }

        .badge-unpaid {
            background: var(--status-due-bg);
            color: var(--status-due-text);
            border: 1px solid var(--status-due-border);
        }

        .badge-warning {
            background: var(--status-warning-bg);
            color: var(--status-warning-text);
            border: 1px solid var(--status-warning-border);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        @media (min-width: 480px) {
            .modal-overlay {
                align-items: center;
                padding: 1rem;
            }
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-modal);
            border: 1px solid var(--border-highlight);
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.9);
            transform: translateY(100%);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .modal {
                border-radius: var(--radius-lg);
                transform: translateY(20px);
            }
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-header h3 {
            font-size: 1rem;
            color: var(--accent-gold-light);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
        }

        .modal-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Forms */
        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.875rem;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .ssid-checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0.75rem;
        }

        .ssid-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .ssid-checkbox-item input[type="checkbox"] {
            accent-color: var(--accent-gold);
            width: 16px;
            height: 16px;
        }

        /* Details Modal Specific */
        .detail-card-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            margin-bottom: 0.85rem;
        }

        .detail-label-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .detail-value-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-gold-light);
        }

        .device-trigger-btn {
            width: 100%;
            background: rgba(197, 160, 89, 0.08);
            border: 1px dashed var(--accent-gold);
            border-radius: var(--radius-md);
            padding: 1rem;
            color: var(--accent-gold-light);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: var(--transition);
        }

        .device-trigger-btn:active {
            background: rgba(197, 160, 89, 0.18);
        }

        .device-details-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.4);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }

        .device-details-container.open {
            display: flex;
        }

        .device-item-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 0.75rem;
        }

        .mac-tag {
            font-family: monospace;
            letter-spacing: 1px;
            background: #000;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            color: var(--accent-gold);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .mac-tag:hover, .mac-tag:active {
            border-color: var(--accent-gold);
            background: rgba(197, 160, 89, 0.2);
            transform: scale(1.02);
        }

        .ssid-pill-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .ssid-pill {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            color: var(--text-main);
        }

        /* Billing List */
        .billing-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .billing-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .billing-item-info strong {
            display: block;
            font-size: 0.95rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .billing-item-info span {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-modal);
            border: 1px solid var(--accent-gold);
            color: var(--text-main);
            padding: 0.75rem 1.25rem;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2000;
            opacity: 0;
            transition: var(--transition);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: var(--border-subtle);
            margin-bottom: 0.75rem;
        }

        /* SSID Manage List */
        .ssid-manage-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ssid-manage-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .ssid-device-count-badge {
            background: rgba(197, 160, 89, 0.15);
            color: var(--accent-gold-light);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-container">
                <div class="brand">
                    <div class="brand-icon">
                        <i class="fa-solid fa-wifi"></i>
                    </div>
                    <h1>WIFI MANAGER <span>1080x1920 MOBILE</span></h1>
                </div>
                <button class="menu-toggle-btn" onclick="toggleNavDrawer()" aria-label="Open Navigation Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- Content -->
        <div class="content">
            <div class="dashboard-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" oninput="renderDashboard()" placeholder="Search owner name...">
                </div>
            </div>

            <div class="owners-list" id="ownersList">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <!-- Hidden CSV File Input -->
    <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="handleImportCSV(event)">

    <!-- Navigation Drawer -->
    <div class="drawer-backdrop" id="drawerBackdrop" onclick="closeNavDrawer()">
        <div class="nav-drawer" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <h3><i class="fa-solid fa-sliders"></i> Menu Navigation</h3>
                <button class="drawer-close-btn" onclick="closeNavDrawer()">&times;</button>
            </div>
            <ul class="drawer-menu">
                <li class="drawer-menu-item" onclick="handleMenuAction('register')">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Register</span>
                </li>
                <li class="drawer-menu-item" onclick="handleMenuAction('ssid')">
                    <i class="fa-solid fa-wifi"></i>
                    <span>SSID</span>
                </li>
                <li class="drawer-menu-item" onclick="handleMenuAction('billing')">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                    <span>Billing Section</span>
                </li>
                <li class="drawer-menu-item" onclick="handleMenuAction('export_csv')">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Export as CSV</span>
                </li>
                <li class="drawer-menu-item" onclick="handleMenuAction('import_csv')">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Import as CSV</span>
                </li>
            </ul>
            <div class="drawer-footer">
                &copy; Circle C RML Programming
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--accent-gold);"></i>
        <span id="toastMessage">Action completed</span>
    </div>

    <!-- 1. REGISTER SSID MODAL -->
    <div class="modal-overlay" id="ssidRegisterModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-wifi"></i> Manage WiFi SSIDs</h3>
                <button class="close-btn" onclick="closeModal('ssidRegisterModal')">&times;</button>
            </div>
            <form onsubmit="handleSSIDRegister(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="ssidName">Add New WiFi SSID</label>
                        <input type="text" id="ssidName" class="form-control" placeholder="e.g. VIP_Lounge_5G" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-plus"></i> Add SSID</button>
                    
                    <div style="margin-top: 1.25rem;">
                        <label style="font-size:0.8rem; color:var(--text-muted); font-weight:500;">Existing SSIDs</label>
                        <div class="ssid-manage-list" id="ssidManageList">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('ssidRegisterModal')">Close</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. REGISTER OWNER NAME & BILLING DATE MODAL -->
    <div class="modal-overlay" id="ownerRegisterModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-plus"></i> Register Owner</h3>
                <button class="close-btn" onclick="closeModal('ownerRegisterModal')">&times;</button>
            </div>
            <form onsubmit="handleOwnerRegister(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="ownerNameInput">Owner Name</label>
                        <input type="text" id="ownerNameInput" class="form-control" placeholder="e.g. RYAN" required>
                    </div>
                    <div class="form-group">
                        <label for="billingDateInput">Billing Date</label>
                        <input type="date" id="billingDateInput" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('ownerRegisterModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Register</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. BILLING SECTION MODAL -->
    <div class="modal-overlay" id="billingSectionModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-file-invoice-dollar"></i> Billing Section</h3>
                <button class="close-btn" onclick="closeModal('billingSectionModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="billing-list" id="billingListContainer">
                    <!-- Populated dynamically -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" onclick="closeModal('billingSectionModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- 4. OWNER DETAILS MODAL -->
    <div class="modal-overlay" id="ownerDetailsModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-id-card"></i> Owner Details</h3>
                <button class="close-btn" onclick="closeModal('ownerDetailsModal')">&times;</button>
            </div>
            <div class="modal-body" id="ownerDetailsBody">
                <!-- Injected via JavaScript -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" id="deleteOwnerBtn" style="color: var(--status-due-text); border-color: rgba(239, 68, 68, 0.3);">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>
                <button type="button" class="btn btn-primary" onclick="closeModal('ownerDetailsModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- 5. ADD DEVICE MODAL -->
    <div class="modal-overlay" id="addDeviceModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fa-solid fa-mobile-screen-button"></i> Add Device</h3>
                <button class="close-btn" onclick="closeModal('addDeviceModal')">&times;</button>
            </div>
            <form onsubmit="handleAddDeviceSubmit(event)">
                <input type="hidden" id="targetOwnerId">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="deviceNameInput">Device Name</label>
                        <input type="text" id="deviceNameInput" class="form-control" placeholder="e.g. Phone / Laptop" required>
                    </div>
                    <div class="form-group">
                        <label for="macAddressInput">MAC Address (Auto-Formatted)</label>
                        <input type="text" id="macAddressInput" class="form-control" placeholder="F4:D4:88:31:00:BC" required oninput="formatMACInput(this)" maxlength="17">
                    </div>
                    <div class="form-group">
                        <label>Assigned WiFi SSIDs (Multiple Allowed)</label>
                        <div class="ssid-checkbox-group" id="ssidCheckboxContainer">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('addDeviceModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Device</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        const STORAGE_SSIDS = 'wifi_app_ssids_v3';
        const STORAGE_OWNERS = 'wifi_app_owners_v3';

        let ssids = [];
        let owners = [];
        let activeOwnerId = null;

        // --- INIT & LOCAL STORAGE --- //
        document.addEventListener('DOMContentLoaded', () => {
            loadStorage();
            document.getElementById('billingDateInput').value = new Date().toISOString().split('T')[0];
            renderDashboard();
        });

        function loadStorage() {
            const storedSsids = localStorage.getItem(STORAGE_SSIDS);
            const storedOwners = localStorage.getItem(STORAGE_OWNERS);
            ssids = storedSsids ? JSON.parse(storedSsids) : [];
            owners = storedOwners ? JSON.parse(storedOwners) : [];
        }

        function saveStorage() {
            localStorage.setItem(STORAGE_SSIDS, JSON.stringify(ssids));
            localStorage.setItem(STORAGE_OWNERS, JSON.stringify(owners));
        }

        // --- NAVIGATION HANDLERS --- //
        function toggleNavDrawer() {
            document.getElementById('drawerBackdrop').classList.toggle('active');
        }

        function closeNavDrawer() {
            document.getElementById('drawerBackdrop').classList.remove('active');
        }

        function handleMenuAction(action) {
            closeNavDrawer();
            setTimeout(() => {
                if (action === 'register') {
                    openModal('ownerRegisterModal');
                } else if (action === 'ssid') {
                    renderSSIDManageList();
                    openModal('ssidRegisterModal');
                } else if (action === 'billing') {
                    renderBillingSection();
                    openModal('billingSectionModal');
                } else if (action === 'export_csv') {
                    exportToCSV();
                } else if (action === 'import_csv') {
                    document.getElementById('csvFileInput').click();
                }
            }, 200);
        }

        // --- ALPHABETICAL SORTING --- //
        function getSortedOwners() {
            return [...owners].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }

        // --- MAC AUTO-FORMATTER --- //
        function formatMACInput(input) {
            let raw = input.value.replace(/[^0-9A-Fa-f]/g, '').toUpperCase();
            if (raw.length > 12) raw = raw.substring(0, 12);
            
            let formatted = '';
            for (let i = 0; i < raw.length; i++) {
                if (i > 0 && i % 2 === 0) {
                    formatted += ':';
                }
                formatted += raw[i];
            }
            input.value = formatted;
        }

        // --- DASHBOARD DUE CALCULATION & RENDERING --- //
        function calculateDueStatus(billingDateStr, isPaid) {
            const today = new Date();
            today.setHours(0,0,0,0);
            
            const due = new Date(billingDateStr);
            due.setHours(0,0,0,0);

            const timeDiff = due.getTime() - today.getTime();
            const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

            let countdownText = '';
            let statusClass = 'due-ok';

            if (!isPaid) {
                if (daysDiff < 0) {
                    countdownText = `Overdue by ${Math.abs(daysDiff)} day(s)`;
                    statusClass = 'due-alert';
                } else if (daysDiff === 0) {
                    countdownText = 'Due Today!';
                    statusClass = 'due-alert';
                } else if (daysDiff <= 7) {
                    countdownText = `${daysDiff} day(s) left and counting`;
                    statusClass = 'due-warning';
                } else {
                    countdownText = `Due in ${daysDiff} days`;
                }
            } else {
                countdownText = `Paid - Next billing: ${billingDateStr}`;
            }

            return { daysDiff, countdownText, statusClass };
        }

        function renderDashboard() {
            const container = document.getElementById('ownersList');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            const sorted = getSortedOwners();
            const filteredOwners = sorted.filter(o => o.name.toLowerCase().includes(searchQuery));

            if (filteredOwners.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-users-slash"></i>
                        <p>No registered owners found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredOwners.map(owner => {
                const initials = owner.name.substring(0, 2).toUpperCase();
                const dueInfo = calculateDueStatus(owner.billingDate, owner.isPaid);

                return `
                    <div class="owner-card" onclick="openOwnerDetailsModal('${owner.id}')">
                        <div class="owner-main-info">
                            <div class="avatar">${initials}</div>
                            <div class="owner-details-text">
                                <h3>${escapeHtml(owner.name)}</h3>
                                <div class="due-indicator ${dueInfo.statusClass}">
                                    <i class="fa-solid fa-clock"></i> ${dueInfo.countdownText}
                                </div>
                            </div>
                        </div>
                        <div>
                            <span class="badge ${owner.isPaid ? 'badge-paid' : 'badge-unpaid'}">
                                ${owner.isPaid ? 'Paid' : 'Unpaid'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- REGISTER OWNER --- //
        function handleOwnerRegister(e) {
            e.preventDefault();
            const nameInput = document.getElementById('ownerNameInput');
            const dateInput = document.getElementById('billingDateInput');

            const newOwner = {
                id: 'owner_' + Date.now(),
                name: nameInput.value.trim().toUpperCase(),
                billingDate: dateInput.value,
                isPaid: false,
                devices: []
            };

            owners.push(newOwner);
            saveStorage();
            renderDashboard();

            showToast(`Owner "${newOwner.name}" registered`);
            nameInput.value = '';
            closeModal('ownerRegisterModal');
        }

        // --- BILLING SECTION --- //
        function renderBillingSection() {
            const container = document.getElementById('billingListContainer');
            const sorted = getSortedOwners();

            if (sorted.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:1rem;">No billing records available.</p>`;
                return;
            }

            container.innerHTML = sorted.map(owner => `
                <div class="billing-item">
                    <div class="billing-item-info">
                        <strong>${escapeHtml(owner.name)}</strong>
                        <span>Billing Date: ${owner.billingDate}</span>
                    </div>
                    <div>
                        ${owner.isPaid ? 
                            `<span class="badge badge-paid"><i class="fa-solid fa-check-circle"></i> Paid</span>` : 
                            `<button class="btn btn-primary btn-sm" onclick="markPaidAndUpdateBilling('${owner.id}')"><i class="fa-solid fa-credit-card"></i> Pay Now</button>`
                        }
                    </div>
                </div>
            `).join('');
        }

        function markPaidAndUpdateBilling(ownerId) {
            const owner = owners.find(o => o.id === ownerId);
            if (owner) {
                owner.isPaid = true;
                
                let currentBilling = owner.billingDate ? new Date(owner.billingDate) : new Date();
                currentBilling.setMonth(currentBilling.getMonth() + 1);
                owner.billingDate = currentBilling.toISOString().split('T')[0];

                saveStorage();
                renderDashboard();
                renderBillingSection();
                showToast(`Payment registered for ${owner.name}. New Date: ${owner.billingDate}`);
            }
        }

        // --- STATUS HELPER FOR DETAILS MODAL --- //
        function getOwnerDetailsStatusBadge(owner) {
            if (owner.isPaid) {
                return `<span class="badge badge-paid"><i class="fa-solid fa-check-circle"></i> Paid</span>`;
            }

            const today = new Date();
            today.setHours(0,0,0,0);
            const due = new Date(owner.billingDate);
            due.setHours(0,0,0,0);

            const daysDiff = Math.ceil((due.getTime() - today.getTime()) / (1000 * 3600 * 24));

            if (daysDiff >= 0 && daysDiff <= 7) {
                return `<span class="badge badge-warning"><i class="fa-solid fa-clock"></i> ${daysDiff} day(s) left and counting</span>`;
            } else if (daysDiff < 0) {
                return `<span class="badge badge-unpaid"><i class="fa-solid fa-triangle-exclamation"></i> Overdue by ${Math.abs(daysDiff)} day(s)</span>`;
            } else {
                return `<span class="badge badge-unpaid"><i class="fa-solid fa-circle-xmark"></i> Unpaid (${daysDiff} days left)</span>`;
            }
        }

        // --- OWNER DETAILS MODAL --- //
        function openOwnerDetailsModal(ownerId) {
            activeOwnerId = ownerId;
            const owner = owners.find(o => o.id === ownerId);
            if (!owner) return;

            const container = document.getElementById('ownerDetailsBody');

            let devicesHtml = '';
            if (owner.devices && owner.devices.length > 0) {
                devicesHtml = owner.devices.map(dev => `
                    <div class="device-item-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <strong style="font-size:0.875rem; color:var(--text-main);">${escapeHtml(dev.name)}</strong>
                            <span class="mac-tag" onclick="copyMacAddress('${dev.mac}', event)">
                                <i class="fa-regular fa-copy" style="font-size:0.75rem;"></i> ${dev.mac}
                            </span>
                        </div>
                        <div class="ssid-pill-list">
                            ${dev.ssids.map(s => `<span class="ssid-pill"><i class="fa-solid fa-wifi" style="font-size:0.6rem; margin-right:2px;"></i> ${escapeHtml(s)}</span>`).join('')}
                        </div>
                    </div>
                `).join('');
            } else {
                devicesHtml = `<p style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:8px;">No devices registered yet.</p>`;
            }

            container.innerHTML = `
                <div class="detail-card-row">
                    <div class="detail-label-text">Owner Name</div>
                    <div class="detail-value-text">${escapeHtml(owner.name)}</div>
                </div>

                <div class="detail-card-row">
                    <div class="detail-label-text">Billing Date & Status</div>
                    <div style="font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:8px; margin-top:4px;">
                        <span>${owner.billingDate}</span>
                        ${getOwnerDetailsStatusBadge(owner)}
                    </div>
                </div>

                <button type="button" class="device-trigger-btn" onclick="toggleDeviceListContainer()">
                    <span><i class="fa-solid fa-mobile-screen"></i> Device (${owner.devices ? owner.devices.length : 0})</span>
                    <i class="fa-solid fa-chevron-down" id="deviceChevron"></i>
                </button>

                <div class="device-details-container" id="deviceDetailsView">
                    ${devicesHtml}
                </div>

                <button type="button" class="btn btn-primary btn-block" onclick="openAddDeviceModal('${owner.id}')">
                    <i class="fa-solid fa-plus-circle"></i> Add Device
                </button>
            `;

            document.getElementById('deleteOwnerBtn').onclick = () => deleteOwner(owner.id);
            openModal('ownerDetailsModal');
        }

        function copyMacAddress(mac, event) {
            event.stopPropagation();
            navigator.clipboard.writeText(mac).then(() => {
                showToast(`MAC Address copied: ${mac}`);
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = mac;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                showToast(`MAC Address copied: ${mac}`);
            });
        }

        function toggleDeviceListContainer() {
            const devView = document.getElementById('deviceDetailsView');
            const chevron = document.getElementById('deviceChevron');
            if (devView) {
                devView.classList.toggle('open');
                if (devView.classList.contains('open')) {
                    chevron.style.transform = 'rotate(180deg)';
                } else {
                    chevron.style.transform = 'rotate(0deg)';
                }
            }
        }

        function deleteOwner(ownerId) {
            if (confirm('Are you sure you want to delete this owner record?')) {
                owners = owners.filter(o => o.id !== ownerId);
                saveStorage();
                renderDashboard();
                closeModal('ownerDetailsModal');
                showToast('Owner deleted');
            }
        }

        // --- ADD DEVICE MODAL --- //
        function openAddDeviceModal(ownerId) {
            if (ssids.length === 0) {
                showToast('Please add at least one WiFi SSID first!', true);
                renderSSIDManageList();
                openModal('ssidRegisterModal');
                return;
            }

            document.getElementById('targetOwnerId').value = ownerId;
            document.getElementById('deviceNameInput').value = '';
            document.getElementById('macAddressInput').value = '';

            const checkboxContainer = document.getElementById('ssidCheckboxContainer');
            checkboxContainer.innerHTML = ssids.map((ssid, index) => `
                <label class="ssid-checkbox-item">
                    <input type="checkbox" name="assignedSSIDs" value="${escapeHtml(ssid)}" ${index === 0 ? 'checked' : ''}>
                    <span>${escapeHtml(ssid)}</span>
                </label>
            `).join('');

            openModal('addDeviceModal');
        }

        function handleAddDeviceSubmit(e) {
            e.preventDefault();
            const ownerId = document.getElementById('targetOwnerId').value;
            const deviceName = document.getElementById('deviceNameInput').value.trim();
            const macAddress = document.getElementById('macAddressInput').value.trim();

            const selectedSSIDs = Array.from(document.querySelectorAll('input[name="assignedSSIDs"]:checked'))
                                       .map(cb => cb.value);

            if (selectedSSIDs.length === 0) {
                showToast('Select at least one SSID!', true);
                return;
            }

            if (macAddress.length < 17) {
                showToast('Please enter a valid 12-digit MAC address', true);
                return;
            }

            const owner = owners.find(o => o.id === ownerId);
            if (owner) {
                if (!owner.devices) owner.devices = [];
                owner.devices.push({
                    id: 'dev_' + Date.now(),
                    name: deviceName,
                    mac: macAddress,
                    ssids: selectedSSIDs
                });

                saveStorage();
                renderDashboard();
                closeModal('addDeviceModal');
                openOwnerDetailsModal(ownerId);
                showToast(`Device "${deviceName}" added successfully`);
            }
        }

        // --- SSID MANAGEMENT & DEVICE BADGE --- //
        function countRegisteredDevicesForSSID(ssidName) {
            let count = 0;
            owners.forEach(owner => {
                if (owner.devices) {
                    owner.devices.forEach(dev => {
                        if (dev.ssids && dev.ssids.includes(ssidName)) {
                            count++;
                        }
                    });
                }
            });
            return count;
        }

        function handleSSIDRegister(e) {
            e.preventDefault();
            const input = document.getElementById('ssidName');
            const newSSID = input.value.trim();

            if (newSSID && !ssids.includes(newSSID)) {
                ssids.push(newSSID);
                saveStorage();
                renderSSIDManageList();
                showToast(`SSID "${newSSID}" registered`);
                input.value = '';
            } else if (ssids.includes(newSSID)) {
                showToast('SSID already exists!', true);
            }
        }

        function renderSSIDManageList() {
            const container = document.getElementById('ssidManageList');
            if (ssids.length === 0) {
                container.innerHTML = `<span style="font-size:0.75rem; color:var(--text-muted);">No SSIDs added yet.</span>`;
                return;
            }

            container.innerHTML = ssids.map(ssid => {
                const deviceCount = countRegisteredDevicesForSSID(ssid);
                return `
                    <div class="ssid-manage-item">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <i class="fa-solid fa-wifi" style="color:var(--accent-gold);"></i>
                            <span>${escapeHtml(ssid)}</span>
                            <span class="ssid-device-count-badge">
                                ${deviceCount} ${deviceCount === 1 ? 'device' : 'devices'}
                            </span>
                        </div>
                        <button type="button" class="btn btn-sm" style="color:var(--status-due-text); padding:2px 6px;" onclick="deleteSSID('${escapeHtml(ssid)}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function deleteSSID(ssidName) {
            ssids = ssids.filter(s => s !== ssidName);
            saveStorage();
            renderSSIDManageList();
            showToast(`SSID "${ssidName}" removed`);
        }

        // --- IMPORT & EXPORT CSV BACKUP --- //
        function exportToCSV() {
            if (ssids.length === 0 && owners.length === 0) {
                showToast('No stored details to export!', true);
                return;
            }

            let csvRows = [];
            csvRows.push(["Type", "Owner Name", "Billing Date", "Status", "Device Name", "MAC Address", "Assigned SSIDs"]);

            ssids.forEach(ssid => {
                csvRows.push(["SSID", "", "", "", "", "", ssid]);
            });

            owners.forEach(owner => {
                const statusStr = owner.isPaid ? "Paid" : "Unpaid";
                if (!owner.devices || owner.devices.length === 0) {
                    csvRows.push(["OWNER", owner.name, owner.billingDate, statusStr, "", "", ""]);
                } else {
                    owner.devices.forEach(dev => {
                        const ssidsStr = (dev.ssids || []).join(';');
                        csvRows.push(["DEVICE", owner.name, owner.billingDate, statusStr, dev.name, dev.mac, ssidsStr]);
                    });
                }
            });

            const csvContent = "data:text/csv;charset=utf-8," + csvRows.map(row => 
                row.map(cell => `"${(cell || '').replace(/"/g, '""')}"`).join(",")
            ).join("\n");

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `wifi_manager_backup_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('Backup exported as CSV');
        }

        function handleImportCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const text = event.target.result;
                    parseAndImportCSV(text);
                    saveStorage();
                    renderDashboard();
                    showToast('CSV imported successfully!');
                } catch (err) {
                    showToast('Failed to parse CSV file.', true);
                }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        function parseAndImportCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) return;

            const newSSIDs = new Set(ssids);
            const ownerMap = new Map();

            owners.forEach(o => ownerMap.set(o.name.toUpperCase(), o));

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const cleanCols = cols.map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());

                if (cleanCols.length < 7) continue;

                const recordType = cleanCols[0];
                const ssidFromCol = cleanCols[6];

                if (recordType === "SSID" && ssidFromCol) {
                    newSSIDs.add(ssidFromCol);
                } else if (recordType === "OWNER" || recordType === "DEVICE") {
                    const ownerName = cleanCols[1].toUpperCase();
                    const billingDate = cleanCols[2];
                    const statusStr = cleanCols[3];
                    const isPaid = statusStr.toLowerCase() === 'paid';
                    const devName = cleanCols[4];
                    const devMac = cleanCols[5];
                    const devSSIDs = ssidFromCol ? ssidFromCol.split(';') : [];

                    devSSIDs.forEach(s => { if (s) newSSIDs.add(s); });

                    let ownerObj = ownerMap.get(ownerName);
                    if (!ownerObj) {
                        ownerObj = {
                            id: 'owner_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                            name: ownerName,
                            billingDate: billingDate || new Date().toISOString().split('T')[0],
                            isPaid: isPaid,
                            devices: []
                        };
                        ownerMap.set(ownerName, ownerObj);
                    } else {
                        ownerObj.billingDate = billingDate || ownerObj.billingDate;
                        ownerObj.isPaid = isPaid;
                    }

                    if (recordType === "DEVICE" && devName && devMac) {
                        const existingDev = ownerObj.devices.find(d => d.mac === devMac);
                        if (!existingDev) {
                            ownerObj.devices.push({
                                id: 'dev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                                name: devName,
                                mac: devMac,
                                ssids: devSSIDs
                            });
                        }
                    }
                }
            }

            ssids = Array.from(newSSIDs);
            owners = Array.from(ownerMap.values());
        }

        // --- UTILS --- //
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            
            toastMsg.innerText = message;
            toast.style.borderColor = isError ? 'var(--status-due-text)' : 'var(--accent-gold)';
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
