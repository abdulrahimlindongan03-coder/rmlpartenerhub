<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML_MAC ADDRESSES</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        /* Dark Mode Eye-Friendly Palette: Midnight Slate (#0f172a), Dark Slate (#1e293b), Soft Teal (#14b8a6) */
        * {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a; /* Midnight Slate */
            color: #e2e8f0; /* Soft off-white text */
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-actions {
            width: 100%;
            max-width: 1050px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }

        .btn-back {
            background-color: #334155;
            color: #f8fafc;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            color: #f8fafc;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-container {
            width: 100%;
            max-width: 1050px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            width: 100%;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 0;
            padding: 12px 8px;
            font-size: 0.85rem;
            white-space: nowrap;
            color: #ffffff;
        }

        .btn-save-data {
            background-color: #0d9488;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.2);
        }

        .btn-save-data:hover {
            background-color: #14b8a6;
            transform: translateY(-2px);
        }

        .btn-export-csv, .btn-import-csv, .btn-save-png {
            background-color: #334155;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .btn-export-csv:hover, .btn-import-csv:hover, .btn-save-png:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .btn-toggle-billing {
            background-color: #0d9488;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.2);
        }

        .btn-toggle-billing:hover {
            background-color: #14b8a6;
            transform: translateY(-2px);
        }

        .registration-form, .delete-owner-card, #capture-area, #billingArea {
            background: #1e293b; /* Dark Slate Card Background */
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .registration-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        label {
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        input[type="text"], input[type="number"], select {
            padding: 12px;
            border: 2px solid #334155;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #e2e8f0;
            background-color: #0f172a; /* Inner dark input */
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            outline: none;
            border-color: #14b8a6;
            background-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
        }

        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #2dd4bf;
        }

        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #14b8a6;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-register {
            background-color: #0d9488;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.2);
        }

        .btn-register:hover {
            background-color: #14b8a6;
            transform: translateY(-2px);
        }

        .delete-owner-flex {
            display: flex;
            gap: 15px;
        }

        .delete-owner-flex select {
            flex: 1;
        }

        .btn-delete-owner {
            background-color: #475569;
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            padding: 12px 24px;
        }

        .btn-delete-owner:hover {
            background-color: #64748b;
            transform: translateY(-2px);
        }

        .category-summary-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .summary-badge {
            background: #0f172a;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            border: 2px solid #334155;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .summary-badge span {
            color: #2dd4bf;
            margin-left: 4px;
        }

        #capture-area h2, #billingArea h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
            font-size: 0.88rem;
        }

        th {
            background-color: #0f172a;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 1px;
        }

        .mac-cell {
            cursor: pointer;
            color: #2dd4bf;
            transition: all 0.2s ease;
            user-select: all;
        }

        .mac-cell:hover {
            text-decoration: underline;
            color: #5eead4;
        }

        .category-header {
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
            padding: 15px;
        }

        .badge {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: inline-block;
            text-align: center;
            text-transform: uppercase;
        }

        /* Dark Mode Optimized Badges */
        .badge-paid {
            background-color: #115e59; /* Dark Teal */
            color: #5eead4; /* Bright Teal Text */
        }

        .badge-disconnect {
            background-color: #7f1d1d; /* Dark Red */
            color: #fca5a5; /* Bright Red Text */
            border: 1px solid #991b1b;
        }

        .badge-warning {
            background-color: #78350f; /* Dark Amber */
            color: #fde68a; /* Bright Yellow Text */
        }

        .badge-nodate {
            background-color: #334155; /* Slate */
            color: #94a3b8; /* Light Slate Text */
        }

        .btn-mark-paid {
            padding: 6px 12px;
            font-size: 0.75rem;
            border-radius: 6px;
            background-color: #0d9488;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-mark-paid:hover {
            background-color: #14b8a6;
        }

        .date-edit-input {
            padding: 6px;
            border: 1px solid #334155;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #e2e8f0;
            background-color: #0f172a;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .action-buttons {
                flex-direction: row;
                gap: 5px;
            }

            .action-buttons button {
                font-size: 0.65rem;
                padding: 10px 2px;
                letter-spacing: 0px;
            }

            .registration-form {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .full-width {
                grid-column: span 1;
            }

            .delete-owner-flex {
                flex-direction: column;
            }

            #capture-area, #billingArea {
                padding: 10px;
                overflow-x: auto;
            }

            th, td {
                padding: 8px;
                font-size: 0.8rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .header-actions {
                justify-content: center;
            }

            .category-summary-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .summary-badge {
                flex: 1 1 30%;
                max-width: 32%;
                font-size: 0.72rem;
                padding: 8px 4px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="header-actions">
        <a href="index.html" class="btn-back">← Back to Dashboard</a>
    </div>

    <div class="main-container">
        <h1>MAC ADDRESSES</h1>

        <div class="action-buttons">
            <button class="btn-save-data" id="btnSaveData">SAVED!</button>
            <button class="btn-export-csv" id="btnExportCsv">Export CSV</button>
            <button class="btn-import-csv" id="btnImportCsv">Import CSV</button>
            <button class="btn-save-png" id="btnSave">Save as PNG</button>
            <button class="btn-toggle-billing" id="btnToggleBilling">BILLING</button>
        </div>

        <div id="dashboardArea">
            <div class="registration-form">
                <div class="input-group full-width">
                    <label>Categories (Select Multiple)</label>
                    <div class="checkbox-container">
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="RML"> RML
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="INDOOR"> INDOOR
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="OUTDOOR"> OUTDOOR
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="EXTENDER"> EXTENDER
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="AC1200"> AC1200
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="categoryCheckbox" value="ROUTER"> ROUTER
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label for="macAddress">MAC Address</label>
                    <input type="text" id="macAddress" placeholder="e.g. B8:3A:08:E5:21:C0" maxlength="17">
                </div>

                <div class="input-group">
                    <label for="ownerName">Owner's Name</label>
                    <input type="text" id="ownerName" placeholder="Enter owner name" list="ownerList">
                    <datalist id="ownerList"></datalist>
                </div>

                <div class="input-group">
                    <label for="device">Device</label>
                    <input type="text" id="device" placeholder="e.g. Router, Smartphone">
                </div>

                <div class="input-group">
                    <label for="payment">Payment</label>
                    <input type="text" id="payment" placeholder="Enter payment amount/status">
                </div>

                <div class="input-group">
                    <label for="dueDay">Due Day of Month (1-31)</label>
                    <input type="number" id="dueDay" min="1" max="31" placeholder="e.g. 15">
                </div>

                <div class="input-group full-width">
                    <div class="checkbox-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="noDueDate">
                            No Due Date
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="isInitialPaid">
                            Mark Initial Bill as Paid
                        </label>
                    </div>
                </div>

                <button class="btn-register full-width" id="btnRegister">Register Device</button>
            </div>

            <div class="delete-owner-card">
                <div class="input-group">
                    <label for="searchInput">Search Records</label>
                    <input type="text" id="searchInput" placeholder="Search by Owner Name or MAC Address...">
                </div>

                <div class="input-group">
                    <label for="deleteMacSelect">Remove Device By MAC Address</label>
                    <div class="delete-owner-flex">
                        <select id="deleteMacSelect"><option value="">-- Select MAC Address to Delete --</option></select>
                        <button class="btn-delete-owner" id="btnDeleteMac">Delete MAC</button>
                    </div>
                </div>
            </div>

            <div id="capture-area">
                <h2>Registered Devices</h2>
                <div class="category-summary-container" id="categorySummary"></div>
                <table id="deviceTable">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>MAC Address (Click to Copy)</th>
                            <th>Device</th>
                            <th>Payment</th>
                            <th>Next Due Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>

        <div id="billingArea" class="hidden">
            <h2>BILLING MANAGEMENT</h2>
            <div class="input-group" style="margin-bottom: 20px;">
                <label for="billingSearchInput">Quick Find by MAC Address</label>
                <input type="text" id="billingSearchInput" placeholder="Type MAC Address here to filter...">
            </div>
            <table id="billingTable">
                <thead>
                    <tr>
                        <th>MAC Address</th>
                        <th>Device</th>
                        <th>Payment</th>
                        <th>Billing Date (Edit)</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="billingTableBody"></tbody>
            </table>
        </div>

        <script id="embeddedData" type="application/json">
            []
        </script>

        <input type="file" id="csvFileInput" accept=".csv" style="display: none;">

    </div>

    <script>
        let recordsData = [];
        let activeCategoryFilter = null;

        const macInput = document.getElementById('macAddress');
        const btnRegister = document.getElementById('btnRegister');
        const tableBody = document.getElementById('tableBody');
        const billingTableBody = document.getElementById('billingTableBody');
        const categorySummary = document.getElementById('categorySummary');
        const btnSaveData = document.getElementById('btnSaveData');
        const btnExportCsv = document.getElementById('btnExportCsv');
        const btnImportCsv = document.getElementById('btnImportCsv');
        const csvFileInput = document.getElementById('csvFileInput');
        const btnSave = document.getElementById('btnSave');
        const deleteMacSelect = document.getElementById('deleteMacSelect');
        const btnDeleteMac = document.getElementById('btnDeleteMac');
        const ownerList = document.getElementById('ownerList');
        const noDueDateCheckbox = document.getElementById('noDueDate');
        const dueDayInput = document.getElementById('dueDay');
        const isInitialPaidCheckbox = document.getElementById('isInitialPaid');
        
        const searchInput = document.getElementById('searchInput');
        const billingSearchInput = document.getElementById('billingSearchInput');
        const btnToggleBilling = document.getElementById('btnToggleBilling');
        const dashboardArea = document.getElementById('dashboardArea');
        const billingArea = document.getElementById('billingArea');

        searchInput.addEventListener('input', renderTable);
        billingSearchInput.addEventListener('input', renderBillingTable);

        btnToggleBilling.addEventListener('click', () => {
            if (billingArea.classList.contains('hidden')) {
                dashboardArea.classList.add('hidden');
                billingArea.classList.remove('hidden');
                btnToggleBilling.textContent = 'BACK TO DASHBOARD';
                btnToggleBilling.style.backgroundColor = '#334155';
                renderBillingTable();
            } else {
                billingArea.classList.add('hidden');
                dashboardArea.classList.remove('hidden');
                btnToggleBilling.textContent = 'BILLING';
                btnToggleBilling.style.backgroundColor = '#0d9488';
                renderTable();
            }
        });

        noDueDateCheckbox.addEventListener('change', function() {
            if (this.checked) {
                dueDayInput.value = '';
                dueDayInput.disabled = true;
                dueDayInput.style.backgroundColor = '#334155'; /* Dark slate for disabled */
                isInitialPaidCheckbox.checked = false;
                isInitialPaidCheckbox.disabled = true;
            } else {
                dueDayInput.disabled = false;
                dueDayInput.style.backgroundColor = '#0f172a';
                isInitialPaidCheckbox.disabled = false;
            }
        });

        function parseLocalDate(dateString) {
            const [y, m, d] = dateString.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatLocalDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getCurrentDateString() {
            return new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }
        
        function getDateTimeString() {
            const d = new Date();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            
            const month = monthNames[d.getMonth()];
            const day = String(d.getDate()).padStart(2, '0');
            const year = d.getFullYear();
            
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            
            return `${month}. ${day}, ${year}_${hours}:${minutes}${ampm}`;
        }

        function addOneMonth(dateString, originalDueDay) {
            let [y, m, d] = dateString.split('-').map(Number);
            let nextMonthIndex = m; 
            let nextYear = y;
            
            if (nextMonthIndex > 11) {
                nextMonthIndex = 0;
                nextYear++;
            }
            
            let maxDays = new Date(nextYear, nextMonthIndex + 1, 0).getDate();
            let safeDay = Math.min(originalDueDay, maxDays);
            
            let result = new Date(nextYear, nextMonthIndex, safeDay);
            return formatLocalDate(result);
        }

        function getOwnerStyles() {
            return {
                bg: `#0f172a`,
                border: `#14b8a6`,
                text: `#2dd4bf`
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            let loaded = false;
            const embeddedScript = document.getElementById('embeddedData');
            if (embeddedScript) {
                try {
                    const embeddedRecords = JSON.parse(embeddedScript.textContent);
                    if (Array.isArray(embeddedRecords) && embeddedRecords.length > 0) {
                        recordsData = embeddedRecords;
                        loaded = true;
                    }
                } catch (e) {
                    console.error("Error parsing embedded data:", e);
                }
            }

            if (!loaded) {
                const savedRecords = localStorage.getItem('mac_address_records');
                if (savedRecords) {
                    recordsData = JSON.parse(savedRecords);
                }
            }

            recordsData = recordsData.map(item => {
                if (item.noDueDate === undefined) {
                    item.noDueDate = false;
                }
                if (!item.nextDueDate && !item.noDueDate) {
                    let today = new Date();
                    today.setHours(0,0,0,0);
                    let originalDueDay = parseInt(item.dueDay, 10) || 1;
                    let y = today.getFullYear();
                    let m = today.getMonth();
                    let maxD = new Date(y, m + 1, 0).getDate();
                    let safeD = Math.min(originalDueDay, maxD);
                    
                    let nextD = new Date(y, m, safeD);
                    if (today > nextD) { 
                        m++;
                        if (m > 11) { m = 0; y++; }
                        maxD = new Date(y, m + 1, 0).getDate();
                        safeD = Math.min(originalDueDay, maxD);
                        nextD = new Date(y, m, safeD);
                    }
                    item.originalDueDay = originalDueDay;
                    item.nextDueDate = formatLocalDate(nextD);
                }
                if (item.category) item.category = item.category.toUpperCase();
                if (item.owner) item.owner = item.owner.toUpperCase();
                if (item.device) item.device = item.device.toUpperCase();
                return item;
            });
            renderTable();
        });

        macInput.addEventListener('input', function (e) {
            let val = e.target.value.replace(/[^a-fA-F0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < val.length; i++) {
                if (i > 0 && i % 2 === 0) formatted += ':';
                formatted += val[i];
            }
            e.target.value = formatted.substring(0, 17);
        });

        window.copyMac = function(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                element.innerText = 'COPIED!';
                element.style.color = '#14b8a6';
                setTimeout(() => {
                    element.innerText = text;
                    element.style.color = '';
                }, 1200);
            }).catch(() => {
                alert('Copied: ' + text);
            });
        };

        function updateChoices() {
            const currentSelectedMac = deleteMacSelect.value;
            deleteMacSelect.innerHTML = '<option value="">-- Select MAC Address to Delete --</option>';
            ownerList.innerHTML = '';

            const owners = [...new Set(recordsData.map(r => r.owner).filter(Boolean))];
            owners.forEach(owner => {
                const dataOpt = document.createElement('option');
                dataOpt.value = owner;
                ownerList.appendChild(dataOpt);
            });

            const macMap = new Map();
            recordsData.forEach(r => {
                if (r.mac && !macMap.has(r.mac)) {
                    macMap.set(r.mac, `${r.mac} (${r.owner || 'UNKNOWN'} - ${r.device || 'DEVICE'})`);
                }
            });

            macMap.forEach((text, mac) => {
                const opt = document.createElement('option');
                opt.value = mac;
                opt.textContent = text;
                deleteMacSelect.appendChild(opt);
            });

            if (macMap.has(currentSelectedMac)) deleteMacSelect.value = currentSelectedMac;
        }

        function renderTable() {
            tableBody.innerHTML = '';
            categorySummary.innerHTML = '';
            
            let today = new Date();
            today.setHours(0,0,0,0);
            
            const searchTerm = searchInput.value.trim().toLowerCase();

            const categoryCounts = {};
            recordsData.forEach(r => {
                if (r.category) {
                    categoryCounts[r.category] = (categoryCounts[r.category] || 0) + 1;
                }
            });

            const defaultCategories = ['RML', 'INDOOR', 'OUTDOOR', 'EXTENDER', 'AC1200', 'ROUTER'];
            const allCategories = [...new Set([...defaultCategories, ...Object.keys(categoryCounts)])];

            allCategories.forEach(cat => {
                const count = categoryCounts[cat] || 0;
                const badge = document.createElement('div');
                badge.className = 'summary-badge';
                badge.style.cursor = 'pointer';
                
                if (activeCategoryFilter === cat) {
                    badge.style.border = '2px solid #14b8a6';
                    badge.style.backgroundColor = '#134e4a';
                }

                badge.innerHTML = `${cat}: <span>${count} Connected</span>`;
                
                badge.onclick = () => {
                    activeCategoryFilter = (activeCategoryFilter === cat) ? null : cat;
                    renderTable();
                };

                categorySummary.appendChild(badge);
            });

            const recordsToDisplay = recordsData.filter(r => {
                const matchesCategory = activeCategoryFilter ? r.category === activeCategoryFilter : true;
                const matchesSearch = searchTerm ? (
                    (r.owner && r.owner.toLowerCase().includes(searchTerm)) ||
                    (r.mac && r.mac.toLowerCase().includes(searchTerm))
                ) : true;
                return matchesCategory && matchesSearch;
            });

            const owners = [...new Set(recordsToDisplay.map(r => r.owner).filter(Boolean))].sort();

            owners.forEach(owner => {
                const ownerRecords = recordsToDisplay.filter(r => r.owner === owner);
                
                if (ownerRecords.length > 0) {
                    const styles = getOwnerStyles();
                    const headerTr = document.createElement('tr');
                    headerTr.innerHTML = `<td colspan="6" class="category-header" style="background-color: ${styles.bg}; color: ${styles.text}; border-bottom: 2px solid ${styles.border};">OWNER: ${owner}</td>`;
                    tableBody.appendChild(headerTr);

                    ownerRecords.forEach(item => {
                        let badgeClass = 'badge-paid';
                        let statusLabel = 'PAID';
                        let dueDateDisplay = item.nextDueDate;

                        if (item.noDueDate) {
                            badgeClass = 'badge-nodate';
                            statusLabel = 'NO DUE DATE';
                            dueDateDisplay = 'N/A';
                        } else {
                            let dueDateObj = parseLocalDate(item.nextDueDate);
                            let diffTime = dueDateObj.getTime() - today.getTime();
                            let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                            if (diffDays < 0) {
                                badgeClass = 'badge-disconnect';
                                statusLabel = 'OVERDUE';
                            } else if (diffDays === 0) {
                                badgeClass = 'badge-warning';
                                statusLabel = 'DUE TODAY';
                            }
                        }

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><span class="badge badge-nodate">${item.category}</span></td>
                            <td class="mac-cell" title="Click to copy" onclick="copyMac('${item.mac}', this)">${item.mac}</td>
                            <td>${item.device}</td>
                            <td>${item.payment}</td>
                            <td>${dueDateDisplay}</td>
                            <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }
            });
            updateChoices();
        }

        // --- Render BILLING Table (Aggregated by Unique MAC Address) ---
        function renderBillingTable() {
            billingTableBody.innerHTML = '';
            let today = new Date();
            today.setHours(0,0,0,0);
            
            const searchTerm = billingSearchInput.value.trim().toLowerCase();

            // Group records by unique MAC Address
            const macGroupMap = new Map();
            recordsData.forEach(item => {
                if (!item.mac) return;
                const macKey = item.mac.toUpperCase();
                if (!macGroupMap.has(macKey)) {
                    macGroupMap.set(macKey, []);
                }
                macGroupMap.get(macKey).push(item);
            });

            macGroupMap.forEach((items, mac) => {
                if (searchTerm && !mac.toLowerCase().includes(searchTerm)) {
                    return;
                }

                // Aggregate unique devices and payments
                const devices = [...new Set(items.map(i => i.device).filter(Boolean))].join(', ');
                const payments = [...new Set(items.map(i => i.payment).filter(Boolean))].join(' | ');

                // Check if all instances have no due date
                const allNoDueDate = items.every(i => i.noDueDate);

                // Find representative item with earliest due date
                let repItem = items[0];
                if (!allNoDueDate) {
                    const validItems = items.filter(i => !i.noDueDate && i.nextDueDate);
                    if (validItems.length > 0) {
                        validItems.sort((a, b) => a.nextDueDate.localeCompare(b.nextDueDate));
                        repItem = validItems[0];
                    }
                }

                let badgeClass = 'badge-paid';
                let statusLabel = 'PAID';
                let actionHtml = '';
                let dueDateDisplay = '';

                if (allNoDueDate) {
                    badgeClass = 'badge-nodate';
                    statusLabel = 'NO DUE DATE';
                    dueDateDisplay = 'N/A';
                    actionHtml = `<span style="font-size: 0.8rem; color:#64748b;">N/A</span>`;
                } else {
                    let dueDateObj = parseLocalDate(repItem.nextDueDate);
                    let diffTime = dueDateObj.getTime() - today.getTime();
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays < 0) {
                        badgeClass = 'badge-disconnect';
                        statusLabel = 'OVERDUE';
                    } else if (diffDays === 0) {
                        badgeClass = 'badge-warning';
                        statusLabel = 'DUE TODAY';
                    }

                    actionHtml = `<button class="btn-mark-paid" onclick="markPaidByMac('${mac}')">MARK PAID</button>`;
                    dueDateDisplay = `<input type="date" class="date-edit-input" value="${repItem.nextDueDate}" onchange="updateBillingDateByMac('${mac}', this.value)">`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="mac-cell" title="Click to copy" onclick="copyMac('${mac}', this)">${mac}</td>
                    <td>${devices}</td>
                    <td>${payments}</td>
                    <td>${dueDateDisplay}</td>
                    <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
                    <td>${actionHtml}</td>
                `;
                billingTableBody.appendChild(tr);
            });
        }

        // --- Functions Triggered by Billing View (Updates all entries for the given MAC) ---
        window.updateBillingDateByMac = function(mac, newVal) {
            if (newVal) {
                let newDateObj = parseLocalDate(newVal);
                recordsData.forEach(item => {
                    if (item.mac && item.mac.toUpperCase() === mac.toUpperCase()) {
                        item.nextDueDate = newVal;
                        item.originalDueDay = newDateObj.getDate();
                    }
                });
                renderBillingTable();
                renderTable();
            }
        };

        window.markPaidByMac = function(mac) {
            recordsData.forEach(item => {
                if (item.mac && item.mac.toUpperCase() === mac.toUpperCase() && !item.noDueDate) {
                    item.nextDueDate = addOneMonth(item.nextDueDate, item.originalDueDay);
                }
            });
            renderTable();
            if (!document.getElementById('billingArea').classList.contains('hidden')) {
                renderBillingTable();
            }
        };

        btnDeleteMac.addEventListener('click', () => {
            const selectedMac = deleteMacSelect.value;
            if (!selectedMac) {
                alert("Please select a MAC address to delete.");
                return;
            }
            if (confirm(`Are you sure you want to delete all entries for MAC address: "${selectedMac}"?`)) {
                recordsData = recordsData.filter(item => item.mac !== selectedMac);
                renderTable();
            }
        });

        btnRegister.addEventListener('click', () => {
            const selectedCategories = Array.from(document.querySelectorAll('input[name="categoryCheckbox"]:checked')).map(cb => cb.value);
            const mac = document.getElementById('macAddress').value;
            const owner = document.getElementById('ownerName').value.trim().toUpperCase();
            const device = document.getElementById('device').value.trim().toUpperCase();
            const payment = document.getElementById('payment').value;
            const noDueDate = noDueDateCheckbox.checked;
            const dueDayVal = dueDayInput.value;
            const isInitialPaid = isInitialPaidCheckbox.checked;

            if (selectedCategories.length === 0 || !mac || !owner || !device || (!noDueDate && !dueDayVal)) {
                alert("Please select at least one Category, and fill in the MAC Address, Owner, Device, and Due Day fields (or select No Due Date).");
                return;
            }

            let originalDueDay = null;
            let nextDueDateStr = 'N/A';

            if (!noDueDate) {
                originalDueDay = parseInt(dueDayVal, 10);
                if (originalDueDay < 1 || originalDueDay > 31) {
                    alert("Please enter a valid day between 1 and 31.");
                    return;
                }

                let today = new Date();
                today.setHours(0,0,0,0);
                let y = today.getFullYear();
                let m = today.getMonth();
                
                let maxD = new Date(y, m + 1, 0).getDate();
                let safeD = Math.min(originalDueDay, maxD);
                let baseDate = new Date(y, m, safeD);

                if (today > baseDate) {
                    m++;
                    if (m > 11) { m = 0; y++; }
                    maxD = new Date(y, m + 1, 0).getDate();
                    safeD = Math.min(originalDueDay, maxD);
                    baseDate = new Date(y, m, safeD);
                }

                nextDueDateStr = formatLocalDate(baseDate);

                if (isInitialPaid) {
                    nextDueDateStr = addOneMonth(nextDueDateStr, originalDueDay);
                }
            }

            selectedCategories.forEach(category => {
                recordsData.push({
                    category,
                    mac,
                    owner,
                    device,
                    payment,
                    noDueDate,
                    originalDueDay,
                    nextDueDate: nextDueDateStr
                });
            });

            renderTable();

            document.querySelectorAll('input[name="categoryCheckbox"]').forEach(cb => cb.checked = false);
            document.getElementById('macAddress').value = '';
            document.getElementById('ownerName').value = '';
            document.getElementById('device').value = '';
            document.getElementById('payment').value = '';
            dueDayInput.value = '';
            noDueDateCheckbox.checked = false;
            dueDayInput.disabled = false;
            dueDayInput.style.backgroundColor = '#0f172a';
            isInitialPaidCheckbox.checked = false;
            isInitialPaidCheckbox.disabled = false;
        });

        btnSaveData.addEventListener('click', () => {
            localStorage.setItem('mac_address_records', JSON.stringify(recordsData));

            btnSaveData.textContent = 'SAVED!';
            btnSaveData.style.backgroundColor = '#14b8a6';
            setTimeout(() => {
                btnSaveData.textContent = 'SAVE CHANGES';
                btnSaveData.style.backgroundColor = '#0d9488';
            }, 2000);
        });

        btnExportCsv.addEventListener('click', () => {
            if (recordsData.length === 0) {
                alert("No records available to export!");
                return;
            }

            let csvContent = "Category,MAC Address,Owner,Device,Payment,No Due Date,Original Due Day,Next Due Date\r\n";
            
            recordsData.forEach(item => {
                let row = [
                    `"${(item.category || '').replace(/"/g, '""')}"`,
                    `"${(item.mac || '').replace(/"/g, '""')}"`,
                    `"${(item.owner || '').replace(/"/g, '""')}"`,
                    `"${(item.device || '').replace(/"/g, '""')}"`,
                    `"${(item.payment || '').replace(/"/g, '""')}"`,
                    `"${item.noDueDate ? 'True' : 'False'}"`,
                    `"${item.originalDueDay !== null && item.originalDueDay !== undefined ? item.originalDueDay : ''}"`,
                    `"${(item.nextDueDate || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            const dateTimeStr = getDateTimeString();
            link.href = URL.createObjectURL(blob);
            link.download = `RML_MAC ${dateTimeStr}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);

            btnExportCsv.textContent = 'EXPORTED!';
            btnExportCsv.style.backgroundColor = '#475569';
            setTimeout(() => {
                btnExportCsv.textContent = 'Export CSV';
                btnExportCsv.style.backgroundColor = '#334155';
            }, 2000);
        });

        btnImportCsv.addEventListener('click', () => {
            csvFileInput.click();
        });

        csvFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    parseCSV(event.target.result);
                } catch (err) {
                    alert("Error parsing CSV file: " + err.message);
                }
            };
            reader.readAsText(file);
            this.value = '';
        });

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            if (lines.length < 2) {
                alert("CSV file is empty or invalid.");
                return;
            }

            function parseCSVLine(line) {
                const result = [];
                let startValue = 0;
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const c = line[i];
                    if (c === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (c === ',' && !inQuotes) {
                        let val = line.substring(startValue, i).trim();
                        if (val.startsWith('"') && val.endsWith('"')) {
                            val = val.substring(1, val.length - 1).replace(/""/g, '"');
                        }
                        result.push(val);
                        startValue = i + 1;
                    }
                }
                let val = line.substring(startValue).trim();
                if (val.startsWith('"') && val.endsWith('"')) {
                    val = val.substring(1, val.length - 1).replace(/""/g, '"');
                }
                result.push(val);
                return result;
            }

            const newRecords = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = parseCSVLine(line);
                if (cols.length >= 5) {
                    const category = (cols[0] || 'RML').toUpperCase();
                    const mac = cols[1] || '';
                    const owner = (cols[2] || '').toUpperCase();
                    const device = (cols[3] || '').toUpperCase();
                    const payment = cols[4] || '';
                    const noDueDate = cols[5] ? cols[5].toLowerCase() === 'true' : false;
                    const originalDueDay = cols[6] && cols[6] !== '' && cols[6] !== 'null' ? parseInt(cols[6], 10) : null;
                    const nextDueDate = cols[7] || 'N/A';

                    if (mac && owner) {
                        newRecords.push({
                            category,
                            mac,
                            owner,
                            device,
                            payment,
                            noDueDate,
                            originalDueDay,
                            nextDueDate
                        });
                    }
                }
            }

            if (newRecords.length > 0) {
                if (confirm(`Successfully parsed ${newRecords.length} records. Click OK to Replace existing records, or Cancel to Append them.`)) {
                    recordsData = newRecords;
                } else {
                    recordsData = recordsData.concat(newRecords);
                }
                renderTable();
                if (!billingArea.classList.contains('hidden')) renderBillingTable();
                alert("CSV imported successfully!");
            } else {
                alert("No valid records found in the CSV file.");
            }
        }

        btnSave.addEventListener('click', () => {
            const targetArea = billingArea.classList.contains('hidden') ? document.getElementById('capture-area') : document.getElementById('billingArea');
            html2canvas(targetArea, {
                scale: 2,
                backgroundColor: "#0f172a" /* Dark Mode Background for PNG */
            }).then(canvas => {
                const link = document.createElement('a');
                const dateStr = getCurrentDateString();
                
                link.download = `MAC_ADDRESS_${dateStr}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
