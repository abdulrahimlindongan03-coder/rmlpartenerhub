<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RML Income Tracker</title>
    <link rel="icon" href="income.png" type="image/png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mobile-Native Black App Background with Animated Grid */
        body {
            background-color: #000000;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0;
            animation: gridScroll 15s linear infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center; /* Centers the app on desktop view */
            overflow-x: hidden;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Enforced Mobile Portrait Container */
        .app-container {
            width: 100%;
            max-width: 430px; /* Locks width to standard large mobile size */
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 15px 40px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 10;
            background: transparent; /* Ensures the inside of the app stays pure black */
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.05); /* Subtle edge separation if on desktop */
        }

        .header-image {
            display: block;
            margin: 10px auto 20px auto;
            max-width: 180px;
            object-fit: contain;
            filter: drop-shadow(0px 4px 12px rgba(0, 242, 254, 0.2));
        }

        /* View Toggling */
        .view { display: none; flex-direction: column; gap: 20px; width: 100%; flex: 1; }
        .view.active { display: flex; animation: slideUp 0.3s ease forwards; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Native App Inputs */
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px; 
            background: #111111;
            border: 1px solid #333333;
            border-radius: 14px;
            color: #fff;
            text-align: center;
            outline: none;
            font-weight: 600 !important;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        input:focus { 
            border-color: #00f2fe; 
            background: #1a1a1a; 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        /* Chunky Mobile Buttons */
        button {
            width: 100%;
            min-height: 54px;
            font-size: 14px;
            font-weight: 700 !important;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, filter 0.2s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:active { transform: scale(0.97); filter: brightness(1.2); }

        .btn-create { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-balance-nav { background: #222222; border: 1px solid #444; color: #00f2fe !important; margin-top: 15px; }
        .btn-add-balance { background: linear-gradient(135deg, #ff0844, #ffb199); }
        
        .button-group { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        .button-group button { margin-top: 0; flex: 1; font-size: 12px; }
        .btn-deposit { background: linear-gradient(135deg, #00c6ff, #0072ff); }
        .btn-pay { background: linear-gradient(135deg, #42e695, #3bb2b8); } 
        .btn-borrow { background: linear-gradient(135deg, #ff0844, #ffb199); }

        /* Sleek Account Lists */
        .account-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .account-list::-webkit-scrollbar { display: none; } /* Hide scrollbar for native app feel */

        .account-card {
            background: #0a0a0a;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .account-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: #00f2fe; border-radius: 4px 0 0 4px;
        }
        .balance-card::before { background: #ff0844; } 
        
        .acc-name { font-size: 15px; font-weight: 600 !important; color: #eee; }
        .acc-balance { font-size: 18px; font-weight: 700 !important; color: #00f2fe; }
        .bal-amount { color: #ff0844; font-size: 16px; font-weight: 700 !important; }

        /* Detail View Headers */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid #222;
            margin-bottom: 10px;
        }

        .top-bar button {
            width: auto; min-height: 36px; padding: 0 15px; margin: 0; font-size: 11px;
        }
        .btn-back { background: transparent; border: 1px solid #444; color: #aaa; }
        .btn-delete { background: rgba(255, 8, 68, 0.15); color: #ff0844; }
        .btn-item-paid { background: rgba(66, 230, 149, 0.15); color: #42e695; width: auto; min-height: 36px; margin: 0; padding: 0 15px;}

        .current-acc-title { 
            font-size: 15px; 
            color: #fff; 
            text-transform: uppercase; 
            text-align: center;
            flex: 1;
        }

        /* Stats Blocks */
        .balances-wrapper { display: flex; gap: 10px; width: 100%; }
        .card {
            background: #0a0a0a;
            padding: 20px 10px;
            border-radius: 16px;
            flex: 1;
            text-align: center;
            border: 1px solid #222;
        }
        .card-title { font-size: 10px; text-transform: uppercase; color: #888; margin-bottom: 8px; font-weight: 600 !important;}
        .savings-amount { font-size: 20px; color: #00f2fe; }
        .borrowed-amount { font-size: 20px; color: #ff0844; }

        /* History */
        .history {
            background: #0a0a0a;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #222;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .history h3 {
            font-size: 12px; color: #666; text-align: center;
            margin-bottom: 15px; font-weight: 600 !important;
        }
        .history-list { list-style: none; overflow-y: auto; flex: 1; max-height: 250px; }
        .history-list::-webkit-scrollbar { display: none; }
        
        .history-list li {
            padding: 12px 0; border-bottom: 1px solid #1a1a1a;
            display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600 !important;
        }
        .history-list li:last-child { border-bottom: none; }
        .text-green { color: #00f2fe; } 
        .text-orange { color: #ff0844; }
        .time-label { font-size: 11px; color: #666; display: block; font-weight: 400 !important;}

        .beta-notice {
            font-weight: 400 !important; font-size: 11px; color: #555;
            text-align: center; margin-top: auto; padding-top: 20px;
        }
        .beta-notice strong { color: #ffb199; font-weight: 600 !important; }

    </style>
</head>
<body>

<div class="app-container">
    <img src="income.png" alt="Income Header" class="header-image">
    
    <!-- DASHBOARD VIEW -->
    <div id="dashboardView" class="view active">
        <div>
            <input type="text" id="newAccountName" placeholder="NEW ACCOUNT NAME">
            <button class="btn-create" onclick="createAccount()">Create Account</button>
            <button class="btn-balance-nav" onclick="openBalanceView()">View Balances To Pay</button>
        </div>
        
        <div class="account-list" id="accountListContainer">
            <!-- Accounts populate here -->
        </div>
        
        <div class="beta-notice">
            <strong>Beta Notice:</strong> Data is stored locally. Clearing site data removes accounts.
        </div>
    </div>

    <!-- BALANCE ITEMS VIEW -->
    <div id="balanceView" class="view">
        <div class="top-bar">
            <button class="btn-back" onclick="showDashboard()">Back</button>
            <div class="current-acc-title" style="color: #ff0844;">Balances Due</div>
            <div style="width: 55px;"></div>
        </div>

        <div>
            <input type="text" id="balanceTitleInput" placeholder="DESCRIPTION" style="margin-bottom: 10px;">
            <input type="number" id="balanceAmountInput" placeholder="AMOUNT (₱)" min="0.01" step="0.01">
            <button class="btn-add-balance" onclick="addBalanceItem()">Add Due Balance</button>
        </div>

        <div class="card" style="padding: 20px; background: #111; border-color: #333;">
            <div class="card-title">Total Pending</div>
            <div class="borrowed-amount" id="totalBalanceDisplay" style="font-size: 28px;">₱0.00</div>
        </div>

        <div class="account-list" id="balanceListContainer">
            <!-- Balance Items populate here -->
        </div>
    </div>

    <!-- ACCOUNT DETAIL VIEW -->
    <div id="accountView" class="view">
        <div class="top-bar">
            <button class="btn-back" onclick="showDashboard()">Back</button>
            <div class="current-acc-title" id="currentAccountTitle">Account</div>
            <button class="btn-delete" onclick="deleteAccount()">Delete</button>
        </div>

        <div class="balances-wrapper">
            <div class="card">
                <div class="card-title">Savings</div>
                <div class="savings-amount" id="savingsDisplay">₱0.00</div>
            </div>
            <div class="card">
                <div class="card-title">Borrowed</div>
                <div class="borrowed-amount" id="borrowedDisplay">₱0.00</div>
            </div>
        </div>

        <div>
            <input type="number" id="amountInput" placeholder="ENTER AMOUNT (₱)" min="0.01" step="0.01">
            <div class="button-group">
                <button class="btn-deposit" onclick="handleTransaction('deposit')">Deposit</button>
                <button class="btn-pay" onclick="handleTransaction('pay')">Pay</button>
                <button class="btn-borrow" onclick="handleTransaction('borrow')">Borrow</button>
            </div>
        </div>

        <div class="history">
            <h3>Recent Transactions</h3>
            <ul class="history-list" id="historyList">
                <!-- History loads here -->
            </ul>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'vault_premium_accounts_v2';
    const BALANCE_STORAGE_KEY = 'vault_balance_items_v2';
    
    let accounts = [];
    let balanceItems = [];
    let currentAccountId = null;

    const phpFormatter = new Intl.NumberFormat('en-PH', {
        style: 'currency',
        currency: 'PHP'
    });

    function init() {
        const storedData = localStorage.getItem(STORAGE_KEY);
        if (storedData) {
            try { accounts = JSON.parse(storedData); } catch(e) { accounts = []; }
        }
        const storedBalances = localStorage.getItem(BALANCE_STORAGE_KEY);
        if (storedBalances) {
            try { balanceItems = JSON.parse(storedBalances); } catch(e) { balanceItems = []; }
        }
        renderDashboard();
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
        localStorage.setItem(BALANCE_STORAGE_KEY, JSON.stringify(balanceItems));
    }

    function renderDashboard() {
        const container = document.getElementById('accountListContainer');
        container.innerHTML = '';
        if (accounts.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#555; font-size: 13px; margin-top:20px; font-weight:400 !important;">No accounts yet.</p>';
            return;
        }
        accounts.forEach(acc => {
            const div = document.createElement('div');
            div.className = 'account-card';
            div.onclick = () => openAccount(acc.id);
            div.innerHTML = `
                <span class="acc-name">${acc.name}</span>
                <span class="acc-balance">${phpFormatter.format(acc.savings)}</span>
            `;
            container.appendChild(div);
        });
    }

    function createAccount() {
        const input = document.getElementById('newAccountName');
        const name = input.value.trim();
        if (!name) { alert("Please enter a valid account name."); return; }
        const newAccount = { id: Date.now().toString(), name: name, savings: 0, borrowed: 0, history: [] };
        accounts.push(newAccount);
        saveData();
        input.value = '';
        renderDashboard();
    }

    function showDashboard() {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('dashboardView').classList.add('active');
        currentAccountId = null;
        renderDashboard();
    }

    function openBalanceView() {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('balanceView').classList.add('active');
        renderBalanceItems();
    }

    function addBalanceItem() {
        const titleInput = document.getElementById('balanceTitleInput');
        const amountInput = document.getElementById('balanceAmountInput');
        const title = titleInput.value.trim();
        const amount = parseFloat(amountInput.value);

        if (!title) { alert("Please enter a description."); return; }
        if (isNaN(amount) || amount <= 0) { alert("Enter a valid amount greater than ₱0."); return; }

        balanceItems.push({ id: Date.now().toString(), title: title, amount: amount });
        saveData();
        titleInput.value = ''; amountInput.value = '';
        renderBalanceItems();
    }

    function removeBalanceItem(id) {
        balanceItems = balanceItems.filter(item => item.id !== id);
        saveData();
        renderBalanceItems();
    }

    function renderBalanceItems() {
        const container = document.getElementById('balanceListContainer');
        container.innerHTML = '';
        let totalDue = 0;

        if (balanceItems.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#555; font-size: 13px; margin-top:20px; font-weight:400 !important;">All caught up!</p>';
        } else {
            balanceItems.forEach(item => {
                totalDue += item.amount;
                const div = document.createElement('div');
                div.className = 'account-card balance-card';
                div.innerHTML = `
                    <div>
                        <div class="acc-name">${item.title}</div>
                        <div class="bal-amount">${phpFormatter.format(item.amount)}</div>
                    </div>
                    <button class="btn-item-paid" onclick="removeBalanceItem('${item.id}')">Done</button>
                `;
                container.appendChild(div);
            });
        }
        document.getElementById('totalBalanceDisplay').innerText = phpFormatter.format(totalDue);
    }

    function openAccount(id) {
        currentAccountId = id;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('accountView').classList.add('active');
        updateAccountUI();
    }

    function getCurrentAccount() { return accounts.find(acc => acc.id === currentAccountId); }

    function updateAccountUI() {
        const acc = getCurrentAccount();
        if (!acc) return;
        document.getElementById('currentAccountTitle').innerText = acc.name;
        document.getElementById('savingsDisplay').innerText = phpFormatter.format(acc.savings);
        document.getElementById('borrowedDisplay').innerText = phpFormatter.format(acc.borrowed);
        renderHistory(acc.history);
    }

    function renderHistory(historyArray) {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';
        if (!historyArray || historyArray.length === 0) {
            historyList.innerHTML = '<li style="justify-content:center; color:#555; border:none; font-weight:400 !important;">No transactions</li>';
            return;
        }
        for (let i = historyArray.length - 1; i >= 0; i--) {
            const item = historyArray[i];
            const li = document.createElement('li');
            let typeText = '', colorClass = '', sign = '';

            if (item.type === 'deposit') { typeText = 'Deposited'; colorClass = 'text-green'; sign = '+'; } 
            else if (item.type === 'pay') { typeText = 'Paid'; colorClass = 'text-green'; sign = '+'; } 
            else if (item.type === 'borrow') { typeText = 'Borrowed'; colorClass = 'text-orange'; sign = '-'; }

            li.innerHTML = `
                <div>
                    <span class="time-label">${item.date}</span>
                    <span>${typeText}</span>
                </div>
                <span class="${colorClass}">${sign}${phpFormatter.format(item.amount)}</span>
            `;
            historyList.appendChild(li);
        }
    }

    function handleTransaction(type) {
        const amountInput = document.getElementById('amountInput');
        let amount = parseFloat(amountInput.value);
        const acc = getCurrentAccount();

        if (isNaN(amount) || amount <= 0) { alert("Enter a valid amount."); return; }

        if (type === 'deposit') { acc.savings += amount; } 
        else if (type === 'pay') {
            if (acc.borrowed <= 0) { alert("No borrowed amount to pay."); return; }
            if (amount > acc.borrowed) { alert("Cannot pay more than borrowed."); return; }
            acc.borrowed -= amount; acc.savings += amount;
        }
        else if (type === 'borrow') {
            if (amount > acc.savings) { alert("Not enough savings."); return; }
            acc.savings -= amount; acc.borrowed += amount;
        }

        const dateStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        acc.history.push({ type: type, amount: amount, date: dateStr });
        if (acc.history.length > 50) acc.history.shift();

        saveData(); updateAccountUI(); amountInput.value = ''; 
    }

    function deleteAccount() {
        const acc = getCurrentAccount();
        if (!acc) return;
        if (confirm(`Delete account "${acc.name}" forever?`)) {
            accounts = accounts.filter(a => a.id !== currentAccountId);
            saveData(); showDashboard();
        }
    }

    init();
</script>
</body>
</html>
