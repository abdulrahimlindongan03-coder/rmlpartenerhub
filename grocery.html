<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RML Smart Inventory Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Theme Colors: Soft Golden Yellow & Deep Olive Black */
            --primary: #E5C158; 
            --primary-hover: #D4AF37;
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #f1c40f;
            --text-main: #F4F5F0;
            --text-muted: #A8AE9D;
            --radius-md: 12px;
            --radius-lg: 16px;
            --glass-bg: rgba(26, 28, 20, 0.75);
            --glass-card: rgba(34, 38, 28, 0.85);
            --glass-border: rgba(229, 193, 88, 0.25);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        /* Desktop outer frame styling */
        body {
            background: #000;
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Strict Mobile Portrait Container */
        .container { 
            width: 100%; 
            max-width: 480px; 
            min-height: 100vh;
            background: linear-gradient(-45deg, #1A1C14, #262A1E, #14150F, #22251A);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
        }

        header {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            margin-bottom: 20px; padding: 15px; gap: 10px;
        }

        header h1 {
            font-size: 1.5rem; font-weight: 700;
            background: -webkit-linear-gradient(45deg, #E5C158, #FFF0B3);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }

        .user-badge {
            background: var(--primary); color: #1A1C14; padding: 4px 10px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 700;
            display: none; align-items: center; gap: 4px; width: fit-content;
            margin: 0 auto;
        }

        header p { color: var(--text-muted); font-size: 0.85rem; font-weight: 500; }
        .header-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }

        #expiry-alert-banner {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: var(--radius-md);
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        #expiry-alert-banner h3 { color: #ff4757; margin-bottom: 6px; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .alert-item-list { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--text-main); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 10px; font-size: 0.75rem; font-weight: 600;
            border-radius: 10px; border: none; cursor: pointer;
            transition: all 0.3s ease; gap: 4px;
        }

        .btn-primary { background: linear-gradient(135deg, #E5C158 0%, #D4AF37 100%); color: #1A1C14; }
        .btn-warning { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #1A1C14; }
        .btn-info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #1A1C14; }
        .btn-danger { background: linear-gradient(135deg, #ff9a44 0%, #fc6076 100%); color: white; }
        .btn-success { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #1A1C14; }

        .btn-delete {
            background: rgba(255, 71, 87, 0.1); color: #ff4757;
            border: 1px solid rgba(255, 71, 87, 0.2); padding: 4px 8px;
            font-size: 0.7rem; border-radius: 6px; cursor: pointer;
        }

        .category-section { margin-bottom: 15px; overflow: hidden; border-radius: var(--radius-md); }
        .category-header {
            padding: 15px; cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }
        .category-title { font-size: 1.05rem; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--primary); }
        .badge { background: var(--primary); color: #1A1C14; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }
        
        .category-content { display: none; padding: 15px; border-top: 1px solid var(--glass-border); }

        /* Strict Mobile Grid */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .card {
            background: var(--glass-card); border-radius: var(--radius-md);
            overflow: hidden; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .card-img-wrapper { position: relative; height: 110px; background: rgba(0,0,0,0.3); padding: 8px; }
        .card img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
        
        .card-content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; }
        .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; margin-bottom: 4px; }
        
        /* Smaller Product Name */
        .card-title { font-size: 0.75rem; line-height: 1.2; font-weight: 600; color: var(--text-main); white-space: normal; word-break: break-word; text-transform: capitalize; }
        
        .barcode-badge {
            font-size: 0.65rem; background: rgba(229, 193, 88, 0.15); color: var(--primary);
            padding: 2px 4px; border-radius: 4px; font-family: monospace;
            display: inline-block; word-break: break-all; border: 1px solid var(--glass-border);
        }

        .batch-list { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
        .batch-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 6px; border-radius: 8px;
            border-left: 3px solid var(--primary); flex-wrap: wrap; gap: 4px;
        }
        .batch-item.no-exp { border-left-color: #00f2fe; background: rgba(0, 242, 254, 0.05); }
        .batch-item.exp-warning { border-left-color: var(--warning); background: rgba(241, 196, 15, 0.05); }
        .batch-item.exp-danger { border-left-color: var(--danger); background: rgba(255, 71, 87, 0.05); }

        .batch-exp { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); }
        
        .controls { display: flex; align-items: center; gap: 6px; }
        .btn-qty {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; width: 22px; height: 22px;
            font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); line-height: 0;
        }
        .qty-display { font-size: 0.85rem; font-weight: 700; min-width: 14px; text-align: center; }

        /* Modal Adjustments for Mobile */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: rgba(26, 28, 20, 0.98); width: 95%; max-width: 400px;
            padding: 20px; border-radius: var(--radius-lg);
            max-height: 90vh; overflow-y: auto; border: 1px solid var(--glass-border);
        }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h2 { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
        .close-btn { background: rgba(255,255,255,0.05); border: none; font-size: 1.2rem; width: 32px; height: 32px; border-radius: 50%; color: var(--text-muted); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-main);}
        .form-group input, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-size: 0.9rem; background: rgba(255,255,255,0.05); color: var(--text-main); outline: none;
        }
        .form-group input.capitalize { text-transform: capitalize; }
        .form-group select option { background: #1A1C14; color: #fff; }
        
        .input-with-btn { display: flex; gap: 8px; }
        
        .file-upload-wrapper {
            border: 2px dashed var(--glass-border); padding: 15px 10px; text-align: center;
            border-radius: 8px; background: rgba(255,255,255,0.02); font-size: 0.8rem; color: var(--text-muted);
        }
        
        #img-preview, #edit-img-preview { max-width: 100%; height: 100px; object-fit: contain; display: none; margin: 10px auto 0; border-radius: 8px; }
        #scanner-container { width: 100%; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 10px; position: relative;}
        
        .modal-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }

        #toast {
            visibility: hidden; background: rgba(229, 193, 88, 0.95); color: #1A1C14;
            text-align: center; border-radius: 30px; padding: 12px 20px; position: fixed; z-index: 2000;
            left: 50%; transform: translateX(-50%); top: -50px; font-size: 0.85rem; font-weight: 700;
            transition: all 0.4s ease;
        }
        #toast.show { visibility: visible; top: 20px; }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 28, 20, 0.9); z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .login-box { padding: 25px; text-align: center; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

    <!-- Welcome / Login Overlay -->
    <div id="login-overlay">
        <div class="glass login-box">
            <h2 style="color: var(--primary); font-size: 1.3rem;">👋 Welcome!</h2>
            <p style="margin: 10px 0; font-size: 0.85rem; color: var(--text-muted);">Please enter your details to access.</p>
            
            <div class="form-group" style="text-align: left;">
                <label>Nickname</label>
                <input type="text" id="nickname-input" placeholder="e.g. LMRahim">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Gmail Address</label>
                <input type="email" id="email-input" placeholder="e.g. name@gmail.com">
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="signup-btn" onclick="registerAccount()">Enter Dashboard 🚀</button>
        </div>
    </div>

    <div class="container">
        <header class="glass">
            <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
                <h1>✨ Smart Inventory</h1>
                <div class="user-badge" id="user-badge">👤 <span id="display-nickname">User</span></div>
                <p id="welcome-msg" style="margin:0;">Stock Tracking Active.</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openModal()">+ Add Product</button>
                <button class="btn btn-info" onclick="openAddBatchModal()">+ Add Stock</button>
                <button class="btn btn-danger" onclick="openConsumeModal()">➖ Consume</button>
                <button class="btn btn-warning" onclick="generateReceipt()">🧾 Receipt</button>
                <button class="btn btn-warning" onclick="exportToCSV()">📤 CSV Backup</button>
                <button class="btn btn-info" onclick="document.getElementById('import-csv-file').click()">📥 Restore</button>
                <input type="file" id="import-csv-file" accept=".csv" style="display:none;" onchange="importFromCSV(event)">
            </div>
        </header>

        <!-- EXPIRING SOON ALERT BANNER -->
        <div id="expiry-alert-banner">
            <h3>⚠️ Expiry Warning</h3>
            <div class="alert-item-list" id="expiry-alert-list"></div>
        </div>

        <main id="app-content"></main>
    </div>

    <!-- ADD NEW PRODUCT MODAL -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Product</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Barcode Lookup</label>
                    <div class="input-with-btn">
                        <input type="text" id="new-barcode" placeholder="Scan or type" oninput="checkBarcodeOnline()">
                        <button class="btn btn-warning" onclick="startScanner('addModal')">📷 Scan</button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="new-name" class="capitalize" placeholder="Name">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="new-category" onchange="handleCategoryChange()"></select>
                    <input type="text" id="new-category-name" class="capitalize" placeholder="New category..." style="display:none; margin-top:8px;">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <div class="file-upload-wrapper" onclick="document.getElementById('new-file').click()">
                        📸 Tap to Upload or Paste
                    </div>
                    <input type="file" id="new-file" accept="image/*" style="display:none;" onchange="previewImage(event)">
                    <img id="img-preview" src="" alt="Preview">
                </div>

                <div class="form-group">
                    <label>Expiration Date</label>
                    <label style="display:flex; align-items:center; gap:6px; font-weight:normal; margin-bottom:6px; cursor:pointer; font-size:0.8rem;">
                        <input type="checkbox" id="new-no-exp" onchange="toggleNoExp('new')"> No Expiration
                    </label>
                    <div id="new-date-columns">
                        <input type="text" id="new-exp-date" placeholder="e.g., 12/25/2026">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="new-qty" value="1" min="1">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:rgba(255,255,255,0.1); color:var(--text-main);" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveNewProduct()">Save</button>
            </div>
        </div>
    </div>

    <!-- EDIT PRODUCT MODAL -->
    <div class="modal-overlay" id="editProductModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Product</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-item-id">
                <div class="form-group">
                    <label>Barcode</label>
                    <input type="text" id="edit-barcode" placeholder="Barcode">
                </div>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="edit-name" class="capitalize" placeholder="Name">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="edit-category"></select>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <div class="file-upload-wrapper" onclick="document.getElementById('edit-file').click()">
                        📸 Tap to Change
                    </div>
                    <input type="file" id="edit-file" accept="image/*" style="display:none;" onchange="previewEditImage(event)">
                    <img id="edit-img-preview" src="" alt="Preview">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:rgba(255,255,255,0.1); color:var(--text-main);" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEditedProduct()">Update</button>
            </div>
        </div>
    </div>

    <!-- SCAN TO ADD TO EXISTING BATCH MODAL -->
    <div class="modal-overlay" id="addBatchModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Stock</h2>
                <button class="close-btn" onclick="closeAddBatchModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Scan Barcode</label>
                    <div class="input-with-btn">
                        <input type="text" id="exist-barcode" placeholder="Scan or type" oninput="checkExistingBarcode()">
                        <button class="btn btn-warning" onclick="startScanner('addExisting')">📷 Scan</button>
                    </div>
                    <p id="exist-product-name" style="margin-top: 8px; font-weight: 600; font-size: 0.85rem;"></p>
                    <input type="hidden" id="exist-item-id">
                </div>
                
                <div class="form-group">
                    <label>Expiration Date</label>
                    <label style="display:flex; align-items:center; gap:6px; font-weight:normal; margin-bottom:6px; font-size:0.8rem;">
                        <input type="checkbox" id="exist-no-exp" onchange="toggleNoExp('exist')"> No Expiration
                    </label>
                    <div id="exist-date-columns">
                        <input type="text" id="exist-exp-date" placeholder="e.g., 12/25/2026">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="exist-qty" value="1" min="1">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:rgba(255,255,255,0.1); color:var(--text-main);" onclick="closeAddBatchModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveExistingBatch()">Add</button>
            </div>
        </div>
    </div>

    <!-- CONSUME / MINUS STOCK MODAL -->
    <div class="modal-overlay" id="consumeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Consume Stock</h2>
                <button class="close-btn" onclick="closeConsumeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Scan Barcode</label>
                    <div class="input-with-btn">
                        <input type="text" id="consume-barcode" placeholder="Scan or type" oninput="checkConsumeBarcode()">
                        <button class="btn btn-warning" onclick="startScanner('consumeStock')">📷 Scan</button>
                    </div>
                    <p id="consume-product-name" style="margin-top: 8px; font-weight: 600; font-size: 0.85rem;"></p>
                    <input type="hidden" id="consume-item-id">
                </div>

                <div class="form-group">
                    <label>Select Batch</label>
                    <select id="consume-batch-select">
                        <option value="" disabled selected>-- Scan first --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="consume-qty" value="1" min="1">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn" style="background:rgba(255,255,255,0.1); color:var(--text-main);" onclick="closeConsumeModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmConsumeStock()">Consume</button>
            </div>
        </div>
    </div>

    <!-- Scanner Modal -->
    <div class="modal-overlay" id="scannerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="scanner-title">Scan Barcode</h2>
                <button class="close-btn" onclick="closeScanner()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="scanner-container">
                    <div id="interactive-reader" style="width:100%;"></div>
                </div>
                <div style="text-align: center;">
                    <button class="btn btn-info" id="flash-btn" style="display:none; margin-bottom: 10px;" onclick="toggleFlash()">🔦 Flash</button>
                </div>
                <p style="text-align:center; color: var(--text-muted); font-size: 0.75rem;">Position inside camera frame</p>
            </div>
        </div>
    </div>

    <div id="toast">Saved!</div>
    <div id="receipt-canvas" style="position:fixed; top:-9999px; width:400px; background:#1A1C14; padding:20px; color:#F4F5F0;"></div>

    <script>
        const EMAILJS_PUBLIC_KEY = "s9JVqJECJ6GtFy_70";  
        const EMAILJS_SERVICE_ID = "service_0jkjrh8";    
        const EMAILJS_TEMPLATE_ID = "template_icemnt4"; 

        if (EMAILJS_PUBLIC_KEY) { emailjs.init(EMAILJS_PUBLIC_KEY); }

        let inventoryData = JSON.parse(localStorage.getItem('premiumInventoryDataV3')) || [];
        let base64ImageString = ""; 
        let editBase64ImageString = "";
        let html5QrcodeScanner = null;
        let currentScannerMode = ""; 
        let torchOn = false;

        function getFormattedFileName(prefix, extension) {
            const d = new Date();
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[d.getMonth()];
            const day = String(d.getDate()).padStart(2, '0');
            const year = d.getFullYear();
            let hours = d.getHours();
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12; 
            return `${prefix} ${month}. ${day}, ${year}_${hours}:${minutes}${ampm}.${extension}`;
        }

        function toTitleCase(str) {
            if (!str) return "";
            return str.toLowerCase().split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function formatExpiryDate(dateStr) {
            if (!dateStr || dateStr.toLowerCase() === 'no expiry') return 'No Expiry';
            let parts = dateStr.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
            let d;
            if (parts) {
                let p1 = parseInt(parts[1]);
                let p2 = parseInt(parts[2]);
                let p3 = parseInt(parts[3]);
                if (p3 < 100) p3 += 2000; 
                if (p1 > 12) d = new Date(p3, p2 - 1, p1);
                else d = new Date(p3, p1 - 1, p2);
            } else {
                d = new Date(dateStr); 
            }
            if (isNaN(d.getTime())) return dateStr;
            const months = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sept.", "Oct.", "Nov.", "Dec."];
            return `${months[d.getMonth()]} ${String(d.getDate()).padStart(2, '0')}, ${d.getFullYear()}`; 
        }

        function toggleNoExp(mode) {
            const isChecked = document.getElementById(`${mode}-no-exp`).checked;
            const dateColumns = document.getElementById(`${mode}-date-columns`);
            if (isChecked) {
                dateColumns.style.opacity = '0.3'; dateColumns.style.pointerEvents = 'none';
                document.getElementById(`${mode}-exp-date`).value = '';
            } else {
                dateColumns.style.opacity = '1'; dateColumns.style.pointerEvents = 'auto';
            }
        }

        function getExpiryStatus(expString) {
            if (expString === 'No Expiry') return { status: 'safe', label: '♾️ No Exp', daysLeft: 9999 };
            const expDate = new Date(expString);
            if (isNaN(expDate.getTime())) return { status: 'safe', label: `Exp: ${expString}`, daysLeft: 9999 };

            const today = new Date(); today.setHours(0, 0, 0, 0);
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { status: 'expired', label: `🔴 Expired`, daysLeft: diffDays };
            else if (diffDays === 0) return { status: 'danger', label: `⚠️ Exp Today!`, daysLeft: 0 };
            else if (diffDays <= 7) return { status: 'warning', label: `⏳ ${diffDays}d left`, daysLeft: diffDays };
            else if (diffDays <= 30) return { status: 'safe', label: `🗓️ ~${Math.ceil(diffDays / 7)}w left`, daysLeft: diffDays };
            else return { status: 'safe', label: `🗓️ Exp: ${expString}`, daysLeft: diffDays };
        }

        function checkAndSendAutomaticEmail() {
            const email = localStorage.getItem('inventoryEmail');
            const nickname = localStorage.getItem('inventoryNickname');
            if (!email) return;

            const todayStr = new Date().toDateString();
            const lastSent = localStorage.getItem('lastAutoExpiryEmailDate');
            if (lastSent === todayStr) return;

            let expiringItemsHTML = "";
            inventoryData.forEach(group => {
                group.items.forEach(item => {
                    item.batches.forEach(batch => {
                        let expInfo = getExpiryStatus(batch.exp);
                        if (expInfo.daysLeft <= 7) expiringItemsHTML += `- ${item.name} (${batch.qty} pcs) - Expiry: ${batch.exp}\n`;
                    });
                });
            });

            if (expiringItemsHTML) {
                emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_name: nickname, to_email: email,
                    message: "🤖 Daily Expiry Report:\n\n" + expiringItemsHTML

        function renderApp() {
            const container = document.getElementById('app-content');
            const openCategoryIndexes = [];
            document.querySelectorAll('.category-content').forEach((content, index) => {
                if (content.style.display === 'block') openCategoryIndexes.push(index);
            });

            container.innerHTML = '';
            let alertBanner = document.getElementById('expiry-alert-banner');
            let alertList = document.getElementById('expiry-alert-list');
            alertList.innerHTML = '';
            let urgentCount = 0;

            if (inventoryData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 30px; font-size:0.9rem; color: var(--text-muted);">No products yet.</div>';
                alertBanner.style.display = 'none';
                populateCategorySelect();
                return;
            }

            inventoryData.forEach((categoryGroup, index) => {
                const section = document.createElement('div');
                section.className = 'category-section glass';
                const isOpen = openCategoryIndexes.includes(index);
                const displayStyle = isOpen ? 'block' : 'none';
                const rotationStyle = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';

                const headerHTML = `
                    <div class="category-header" onclick="toggleCategory(${index})">
                        <div class="category-title">
                            <span>📁 ${categoryGroup.category}</span>
                            <span class="badge">${categoryGroup.items.length}</span>
                            <button class="btn-delete" style="margin-left: 10px;" onclick="event.stopPropagation(); deleteCategory(${index})">🗑️</button>
                        </div>
                        <div class="category-icon" id="icon-${index}" style="transform: ${rotationStyle}; transition: 0.3s; color: var(--primary);">▼</div>
                    </div>
                `;

                let gridHTML = `<div class="category-content" id="content-${index}" style="display:${displayStyle};"><div class="grid">`;
                categoryGroup.items.forEach(item => { 
                    gridHTML += renderProductCard(item); 
                    item.batches.forEach(b => {
                        let status = getExpiryStatus(b.exp);
                        if (status.daysLeft <= 7) {
                            urgentCount++;
                            alertList.innerHTML += `<div>• <b>${item.name}</b> (${b.qty}) — <span style="color:#d63031; font-weight:600;">${status.label}</span></div>`;
                        }
                    });
                });
                gridHTML += `</div></div>`;
                section.innerHTML = headerHTML + gridHTML;
                container.appendChild(section);
            });

            alertBanner.style.display = urgentCount > 0 ? 'block' : 'none';
            populateCategorySelect();
        }

        function renderProductCard(item) {
            let batchesHTML = '';
            let totalQty = item.batches.reduce((sum, b) => sum + b.qty, 0);
            let outOfStockBadge = totalQty === 0 
                ? `<div style="margin-top: 2px;"><span style="background: #ff4757; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: 700;">OUT OF STOCK</span></div>` : '';

            item.batches.forEach((batch) => {
                const expStatus = getExpiryStatus(batch.exp);
                let badgeClass = batch.exp === 'No Expiry' ? 'no-exp' : (expStatus.status === 'expired' || expStatus.status === 'danger' ? 'exp-danger' : (expStatus.status === 'warning' ? 'exp-warning' : ''));
                const expDisplayText = batch.exp === 'No Expiry' ? 'No Exp' : `Exp: ${batch.exp}`;

                batchesHTML += `
                    <div class="batch-item ${badgeClass}">
                        <span class="batch-exp">${expDisplayText}</span>
                        <div class="controls">
                            <button class="btn-qty" onclick="updateBatchQty('${item.id}', '${batch.exp}', -1)">-</button>
                            <span class="qty-display">${batch.qty}</span>
                            <button class="btn-qty" onclick="updateBatchQty('${item.id}', '${batch.exp}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
            return `
                <div class="card">
                    <div class="card-img-wrapper"><img src="${item.img}" alt="${item.name}" loading="lazy"></div>
                    <div class="card-content">
                        <div class="card-header-row">
                            <h3 class="card-title">${item.name}</h3>
                            <div style="display: flex; gap: 4px;">
                                <button class="btn-delete" style="background: rgba(229, 193, 88, 0.1); color: var(--primary); border-color: rgba(229, 193, 88, 0.2); padding: 2px 6px;" onclick="openEditModal('${item.id}')">✏️</button>
                                <button class="btn-delete" style="padding: 2px 6px;" onclick="deleteProduct('${item.id}')">🗑️</button>
                            </div>
                        </div>
                        <div style="margin-bottom: 8px; display: flex; flex-direction: column;">
                            ${item.barcode ? `<span class="barcode-badge">🏷️ ${item.barcode}</span>` : ''}
                            ${outOfStockBadge}
                        </div>
                        <div class="batch-list">${batchesHTML}</div>
                    </div>
                </div>
            `;
        }

        async function checkBarcodeOnline() {
            const inputVal = document.getElementById('new-barcode').value.trim();
            if (inputVal.length < 3) return;

            if (inputVal.length >= 8 && !isNaN(inputVal)) {
                try {
                    let response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${inputVal}.json`);
                    let data = await response.json();
                    if(data.status === 1 && data.product && data.product.product_name) {
                        document.getElementById('new-name').value = toTitleCase(data.product.product_name);
                        if(data.product.image_url) {
                            const preview = document.getElementById('img-preview');
                            preview.src = data.product.image_url; preview.style.display = 'block';
                            base64ImageString = data.product.image_url;
                        }
                        showToast("Online Match Found! 🌐"); return;
                    }
                } catch(e) {}
            }
            const localDB = {
                "pencil": { name: "Graphite Pencil", img: "https://images.unsplash.com/photo-1583485088034-697b5bc54ccd?w=400&q=60" },
                "pen": { name: "Gel Pen", img: "https://images.unsplash.com/photo-1585336261022-62167dde1cf8?w=400&q=60" },
                "notebook": { name: "Spiral Notebook", img: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=60" }
            };
            for (let key in localDB) {
                if (inputVal.toLowerCase().includes(key)) {
                    document.getElementById('new-name').value = localDB[key].name;
                    const preview = document.getElementById('img-preview');
                    preview.src = localDB[key].img; preview.style.display = 'block';
                    base64ImageString = localDB[key].img;
                    showToast("Image Auto-Fetched! 📸"); break;
                }
            }
        }

        function saveNewProduct() {
            const barcode = document.getElementById('new-barcode').value.trim();
            const name = toTitleCase(document.getElementById('new-name').value.trim());
            let category = document.getElementById('new-category').value;
            const newCatName = toTitleCase(document.getElementById('new-category-name').value.trim());
            const qty = parseInt(document.getElementById('new-qty').value);
            
            if (!name) return alert("Product name is required!");
            if (!category) return alert("Please select/add a category!");
            if (isNaN(qty) || qty <= 0) return alert("Quantity >= 1.");

            let formattedDate = "No Expiry";
            if (!document.getElementById('new-no-exp').checked) {
                const dateVal = document.getElementById('new-exp-date').value.trim();
                if (!dateVal) return alert("Add Date or check 'No Expiration'.");
                formattedDate = formatExpiryDate(dateVal); 
            }
            if (category === 'add_new_category') {
                if (!newCatName) return alert("Enter new category name.");
                category = newCatName; 
            }

            let finalImage = base64ImageString || "data:image/svg+xml;base64," + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" style="background:%23262A1E"><text x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="60" font-weight="bold" fill="%23A8AE9D">${name.charAt(0).toUpperCase()}</text></svg>`);
            const newItem = { id: 'item_' + Date.now(), barcode: barcode, name: name, batches: [{ exp: formattedDate, qty: qty }], img: finalImage };

            let catGroup = inventoryData.find(g => g.category.toLowerCase() === category.toLowerCase());
            if (catGroup) catGroup.items.push(newItem); else inventoryData.push({ category: category, items: [newItem] });
            
            closeModal(); autoSaveData();
        }

        function previewEditImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, 400, 400);
                    editBase64ImageString = canvas.toDataURL('image/jpeg', 0.8);
                    const preview = document.getElementById('edit-img-preview');
                    preview.src = editBase64ImageString; preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveEditedProduct() {
            const itemId = document.getElementById('edit-item-id').value;
            const name = toTitleCase(document.getElementById('edit-name').value.trim());
            const newCategory = document.getElementById('edit-category').value;
            if (!name) return alert("Name required!");

            let targetItem = null, oldGIdx = -1, oldIIdx = -1;
            for (let g = 0; g < inventoryData.length; g++) {
                let iIdx = inventoryData[g].items.findIndex(i => i.id === itemId);
                if (iIdx !== -1) { targetItem = inventoryData[g].items[iIdx]; oldGIdx = g; oldIIdx = iIdx; break; }
            }
            if (!targetItem) return;

            targetItem.barcode = document.getElementById('edit-barcode').value.trim();
            targetItem.name = name; targetItem.img = editBase64ImageString || targetItem.img;
            inventoryData[oldGIdx].items.splice(oldIIdx, 1);
            if (inventoryData[oldGIdx].items.length === 0 && inventoryData[oldGIdx].category !== newCategory) inventoryData.splice(oldGIdx, 1);

            let targetGroup = inventoryData.find(g => g.category.toLowerCase() === newCategory.toLowerCase());
            if (targetGroup) targetGroup.items.push(targetItem); else inventoryData.push({ category: newCategory, items: [targetItem] });

            closeEditModal(); autoSaveData(); showToast("Updated! ✏️");
        }

            if (!itemId) return alert("Scan valid barcode.");
            const qty = parseInt(document.getElementById('exist-qty').value);
            if (isNaN(qty) || qty <= 0) return alert("Qty >= 1.");

                const dateVal = document.getElementById('exist-exp-date').value.trim();
                if (!dateVal) return alert("Enter Date or No Exp.");

        function confirmConsumeStock() {
            const itemId = document.getElementById('consume-item-id').value;
            const batchExp = document.getElementById('consume-batch-select').value;
            const consumeQty = parseInt(document.getElementById('consume-qty').value);

            if (!itemId || !batchExp || isNaN(consumeQty) || consumeQty <= 0) return alert("Select product, batch, and valid qty.");
            for (let group of inventoryData) {
                let item = group.items.find(i => i.id === itemId);
                if (item) {
                    let batch = item.batches.find(b => b.exp === batchExp);
                    if (batch) {
                        if (consumeQty > batch.qty) return alert(`Max available: ${batch.qty}`);
                        batch.qty = Math.max(0, batch.qty - consumeQty);
                        closeConsumeModal(); autoSaveData(); return;
                    }
                }
            }
        }

        function updateBatchQty(itemId, batchExp, change) {
            for (let group of inventoryData) {
                let item = group.items.find(i => i.id === itemId);
                if (item) {
                    let batch = item.batches.find(b => b.exp === batchExp);
                    if (batch) {
                        batch.qty += change;
                        if (batch.qty < 0) {
                            if (confirm("Delete this batch?")) item.batches.splice(item.batches.indexOf(batch), 1);
                            else batch.qty = 0; 
                        }
                        autoSaveData(true); return;
                    }
                }
            }
        }

        function deleteProduct(itemId) {
            if (!confirm("Delete product?")) return;
            for (let group of inventoryData) {
                const idx = group.items.findIndex(i => i.id === itemId);
                if (idx !== -1) { group.items.splice(idx, 1); autoSaveData(); break; }
            }
        }

        function startScanner(mode) {
            currentScannerMode = mode; document.getElementById('scannerModal').classList.add('active');
            if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("interactive-reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 150 } }, onScanSuccess)
                .then(() => {
                    const track = html5QrcodeScanner.getRunningTrackCameraCapabilities();
                    document.getElementById('flash-btn').style.display = (track && track.torchFeature && track.torchFeature().isSupported()) ? 'inline-block' : 'none';
                }).catch(() => { alert("Camera failed."); closeScanner(); });
        }

        function toggleFlash() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
                torchOn = !torchOn;
                html5QrcodeScanner.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
                showToast(torchOn ? "Flash ON 🔦" : "Flash OFF");
            }
        }

        function onScanSuccess(text) {
            closeScanner();
            if (currentScannerMode === 'addModal') { document.getElementById('new-barcode').value = text; checkBarcodeOnline(); }
            else if (currentScannerMode === 'addExisting') { document.getElementById('exist-barcode').value = text; checkExistingBarcode(); }
            else if (currentScannerMode === 'consumeStock') { document.getElementById('consume-barcode').value = text; checkConsumeBarcode(); }
        }

        function closeScanner() {
            if (html5QrcodeScanner && html5QrcodeScanner.isScanning) html5QrcodeScanner.stop().then(() => document.getElementById('scannerModal').classList.remove('active'));
            else document.getElementById('scannerModal').classList.remove('active');
            document.getElementById('flash-btn').style.display = 'none'; torchOn = false;
        }

        function previewImage(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, 400, 400);
                    base64ImageString = canvas.toDataURL('image/jpeg', 0.8);
                    const preview = document.getElementById('img-preview');
                    preview.src = base64ImageString; preview.style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.addEventListener('paste', e => {
            const isAdd = document.getElementById('productModal').classList.contains('active');
            const isEdit = document.getElementById('editProductModal').classList.contains('active');
            if (!isAdd && !isEdit) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let idx in items) {
                const item = items[idx];
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas'); canvas.width = 400; canvas.height = 400;
                            const ctx = canvas.getContext('2d');
                            const scale = Math.min(canvas.width / img.width, canvas.height / img.height);
                            const x = (canvas.width / 2) - (img.width / 2) * scale; const y = (canvas.height / 2) - (img.height / 2) * scale;
                            ctx.fillStyle = "#262A1E"; ctx.fillRect(0, 0, 400, 400); ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                            const b64 = canvas.toDataURL('image/jpeg', 0.8);
                            if (isAdd) { base64ImageString = b64; document.getElementById('img-preview').src = b64; document.getElementById('img-preview').style.display = 'block'; }
                            else { editBase64ImageString = b64; document.getElementById('edit-img-preview').src = b64; document.getElementById('edit-img-preview').style.display = 'block'; }
                            showToast("Pasted! 📋");
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(item.getAsFile()); e.preventDefault(); break;
                }
            }
        });

        function showToast(msg) {
            const t = document.getElementById("toast"); t.innerText = msg; t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2000);
        }

        function generateReceipt() {
            const rDiv = document.getElementById('receipt-canvas'); const now = new Date();
            const nickname = localStorage.getItem('inventoryNickname') || 'Admin';
            let html = `<div style="text-align:center; border-bottom:2px dashed #E5C158; padding-bottom:15px; margin-bottom:15px;">
                <h2 style="margin:0; font-size:22px; color:#E5C158;">${nickname}'s Inventory</h2>
                <p style="margin:4px 0 0 0; color:#A8AE9D; font-size:12px;">${now.toLocaleDateString()} ${now.toLocaleTimeString()}</p></div>`;
            inventoryData.forEach(g => {
                if(g.items.length===0) return;
                html += `<div style="margin-top:15px; font-weight:700; border-bottom:1px solid rgba(255,255,255,0.1); font-size:16px; padding-bottom:4px;">${g.category}</div>`;
                g.items.forEach(i => {
                    let tQty = i.batches.reduce((s,b)=>s+b.qty,0);
                    let sLbl = tQty===0 ? `<span style="color:#ff4757; font-size:11px;">[OUT]</span>` : '';
                    let bStrs = i.batches.map(b => b.exp==='No Expiry'?`${b.qty}p (No Exp)`:`${b.qty}p (Exp: ${b.exp})`).join('<br>');
                    html += `<div style="display:flex; align-items:center; gap:10px; margin-top:10px;">
                        <img src="${i.img}" style="width:40px; height:40px; border-radius:6px; object-fit:cover;" ${i.img.startsWith('data:')?'':'crossorigin="anonymous"'}>
                        <div style="font-size:13px; font-weight:600;">${i.name} <span style="font-size:11px; color:#A8AE9D;">(Tot: ${tQty})</span> ${sLbl}
                        <div style="font-size:11px; color:#A8AE9D;">${bStrs}</div></div></div>`;
                });
            });
            rDiv.innerHTML = html; showToast("Generating... ⏳");
            setTimeout(() => {
                html2canvas(rDiv, { backgroundColor: '#1A1C14', scale: 2, useCORS: true }).then(c => {
                    const l = document.createElement('a'); l.download = getFormattedFileName("Inventory", "png");
                    l.href = c.toDataURL("image/png"); l.click(); rDiv.innerHTML = ''; showToast("Downloaded! 🧾");
                });
            }, 800);
        }

        function exportToCSV() {
            if(inventoryData.length===0) return alert("No data!");
            let csv = "Category,ItemID,Barcode,Name,Expiry,Quantity,Image\n";
            inventoryData.forEach(g => {
                let cat = g.category.replace(/"/g, '""');
                g.items.forEach(i => {
                    let id = i.id.replace(/"/g, '""'), bCode = (i.barcode||"").replace(/"/g, '""'), n = i.name.replace(/"/g, '""'), img = i.img.replace(/"/g, '""');
                    i.batches.forEach(b => csv += `"${cat}","${id}","${bCode}","${n}","${b.exp.replace(/"/g, '""')}","${b.qty}","${img}"\n`);
                });
            });
            const link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = getFormattedFileName("Inventory", "csv"); link.click(); showToast("Exported! 📤");
        }

        function importFromCSV(e) {
            if (!confirm("Importing will overwrite current data. Proceed?")) return e.target.value = '';
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = ev.target.result; let rows = [], curR = [], curC = '', inQ = false;
                for (let i = 0; i < text.length; i++) {
                    let char = text[i];
                    if (inQ) {
                        if (char === '"' && text[i+1] === '"') { curC += '"'; i++; } else if (char === '"') inQ = false; else curC += char;
                    } else {
                        if (char === '"') inQ = true; else if (char === ',') { curR.push(curC); curC = ''; }
                        else if (char === '\n' || char === '\r') { if (char === '\r' && text[i+1] === '\n') i++; curR.push(curC); rows.push(curR); curR = []; curC = ''; }
                        else curC += char;
                    }
                }
                if (curC || curR.length > 0) { curR.push(curC); rows.push(curR); }
                if (rows.length < 2) return alert("Invalid CSV.");
                let newInv = [];
                for (let i = 1; i < rows.length; i++) {
                    let r = rows[i]; if (r.length < 7) continue;
                    let catGrp = newInv.find(g => g.category === r[0]);
                    if (!catGrp) { catGrp = { category: r[0], items: [] }; newInv.push(catGrp); }
                    let item = catGrp.items.find(it => it.id === r[1]);
                    if (!item) { item = { id: r[1], barcode: r[2], name: r[3], img: r[6], batches: [] }; catGrp.items.push(item); }
                    item.batches.push({ exp: r[4], qty: parseInt(r[5], 10) });
                }
                inventoryData = newInv; autoSaveData(); e.target.value = ''; showToast("Restored! 📥");
            };
            reader.readAsText(e.target.files[0]);
        }

        checkLogin(); renderApp();
    </script>
</body>
